  /* ============ 作业提效工具（作文评语 / 课文填空） ============ */
  var FIVE_DIMS=[["主题",["切题","新颖","中心明确"]],["结构",["条理清晰","首尾呼应","层次分明"]],["情感",["真挚动人","有感染力","情感细腻"]],["选材",["取材典型","贴近生活","素材丰富"]],["语言",["生动流畅","用词准确","善用修辞"]]];
  function renderHwTools(){
    mstate.wTags=mstate.wTags||{};
    var dims=FIVE_DIMS.map(function(d){var k=d[0],opts=d[1];var chips=opts.map(function(o){var on=mstate.wTags[k]===o;return '<span class="tag '+(on?"blue":"gray")+'" style="cursor:pointer;margin:2px" onclick="App.toggleWTag(\''+k+'\',\''+o+'\')">'+esc(o)+'</span>';}).join("");return '<div style="margin:6px 0"><div class="muted" style="font-size:12px;margin-bottom:4px">'+k+'</div>'+chips+'</div>';}).join("");
    return '<div class="grid-2">'
      +'<div class="card"><div class="card-head"><h3>作文评语生成器</h3></div>'
      +'<div class="hint">五个维度各选一个词语（点击切换），自动拼成个性化评语；可批量生成所选班级并导出 Word。</div>'+dims
      +'<div class="toolbar" style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="App.genEssayComments()">'+ICONS.ai+' 生成评语</button><button class="btn btn-outline btn-sm" onclick="App.exportEssayComments()">'+ICONS.download+' 导出Word</button></div>'
      +'<div id="essayOut" class="note-box" style="margin-top:12px">选择标签后点击生成，将按当前班级（或全部）为每位学生生成一条评语。</div></div>'
      +'<div class="card"><div class="card-head"><h3>课文填空生成（无OCR版）</h3></div>'
      +'<div class="field"><label>粘贴课文原文</label><textarea id="fb_text" style="min-height:130px" placeholder="将课文文字粘贴到这里，可先去掉标点干扰，生成后手动核对"></textarea></div>'
      +'<div class="grid-2col"><div class="field"><label>挖空密度</label><select id="fb_density" class="select" style="max-width:none"><option value="0.25">稀疏（约1/4）</option><option value="0.4" selected>适中（约40%）</option><option value="0.6">密集（约60%）</option></select></div><div class="field"><label>含答案</label><select id="fb_ans" class="select" style="max-width:none"><option value="0">学生版</option><option value="1">含答案页</option></select></div></div>'
      +'<div class="toolbar"><button class="btn btn-primary btn-sm" onclick="App.genFillBlank()">'+ICONS.ai+' 生成填空卷</button><button class="btn btn-outline btn-sm" onclick="App.downloadFillBlank()">'+ICONS.download+' 下载Word</button></div>'
      +'<div id="fbOut" class="note-box" style="margin-top:12px">粘贴课文后点击生成，可预览并下载（含姓名/班级/日期栏与参考答案）。</div></div>'
      +'</div>';
  }
  function toggleWTag(k,o){mstate.wTags=mstate.wTags||{};if(mstate.wTags[k]===o)delete mstate.wTags[k];else mstate.wTags[k]=o;render();}
  function buildEssayComment(name){
    var tags=mstate.wTags||{};
    var parts=FIVE_DIMS.map(function(d){var k=d[0];return tags[k]?k+tags[k]:"";}).filter(Boolean);
    var head=parts.length?("本次作文"+parts.join("、")+"。"):"本次作文整体认真完成。";
    var tail="希望继续多读多写、精益求精，让文字更有力量！";
    return name+"同学："+head+tail;
  }
  function genEssayComments(){
    var list=DB.students.filter(function(s){return filterClass==="all"||s.id.indexOf(filterClass+"-")===0;});
    if(!Object.keys(mstate.wTags||{}).length){toast("请先选择评语标签");return;}
    mstate.essayList=list.map(function(s){return {name:s.name,comment:buildEssayComment(s.name)};});
    document.getElementById("essayOut").innerHTML=mstate.essayList.map(function(e){return '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border-strong)"><b>'+esc(e.name)+'：</b><div style="margin-top:4px">'+esc(e.comment)+'</div><button class="btn btn-soft btn-sm" style="margin-top:6px" onclick="App.copyText(\''+e.comment.replace(/'/g,"")+'\')">'+ICONS.copy+' 复制</button></div>';}).join("")||'<div class="empty">无可生成的学生</div>';
    toast("已生成 "+mstate.essayList.length+" 条评语");
  }
  function exportEssayComments(){
    if(!mstate.essayList||!mstate.essayList.length){toast("请先生成评语");return;}
    var body=mstate.essayList.map(function(e){return '<p><b>'+esc(e.name)+'：</b>'+esc(e.comment)+'</p>';}).join("");
    exportDoc("作文评语-"+DB.setting.className+".doc","作文评语（"+DB.setting.className+"）",body);
  }
  function genFillBlank(){
    var txt=(document.getElementById("fb_text").value||"").replace(/\s+/g," ").trim();
    if(!txt){toast("请先粘贴课文");return;}
    var rate=parseFloat(document.getElementById("fb_density").value)||0.4;
    var withAns=document.getElementById("fb_ans").value==="1";
    // 按句子切分（兼容不支持 lookbehind 的浏览器）
    var sentences=txt.match(/[^。！？；.!?;]+[。！？；.!?;]?/g)||[txt];
    if(sentences.length<3){sentences=txt.split(/[，,、]/).map(function(s){return s.trim();}).filter(Boolean);}
    var target=Math.max(1,Math.round(sentences.length*rate));
    var idxs=[];
    while(idxs.length<target&&idxs.length<sentences.length){var i=Math.floor(Math.random()*sentences.length);if(idxs.indexOf(i)<0)idxs.push(i);}
    idxs.sort(function(a,b){return a-b;});
    var answers=[];var body="";var ai=0;
    sentences.forEach(function(s,i){
      if(idxs.indexOf(i)>=0){answers.push(s);body+='<span class="blank"></span>';}
      else body+=esc(s);
    });
    mstate.fb={body:body,answers:answers,withAns:withAns};
    var out='<div style="margin-bottom:8px"><b>姓名：</b><span class="dotline"></span>　<b>班级：</b><span class="dotline"></span>　<b>日期：</b><span class="dotline"></span></div><div style="line-height:2.2">'+body+'</div>';
    if(withAns&&answers.length)out+='<div style="margin-top:14px;border-top:1px dashed #999;padding-top:8px"><b>参考答案：</b>'+answers.map(function(a,i){return '<div>('+(i+1)+') '+esc(a)+'</div>';}).join("")+'</div>';
    document.getElementById("fbOut").innerHTML=out;
    toast("已生成填空卷（挖空 "+answers.length+" 处）");
  }
  function downloadFillBlank(){
    if(!mstate.fb){toast("请先生成填空卷");return;}
    var fb=mstate.fb;
    var body='<p style="text-align:left"><b>姓名：</b><span class="dotline"></span>　<b>班级：</b><span class="dotline"></span>　<b>日期：</b><span class="dotline"></span></p><p style="line-height:2.4;text-align:left">'+fb.body+'</p>';
    if(fb.withAns&&fb.answers.length)body+='<h2>参考答案</h2><ol>'+fb.answers.map(function(a){return '<li>'+esc(a)+'</li>';}).join("")+'</ol>';
    exportDoc("课文填空-"+todayStr()+".doc","课文填空练习",body);
  }

  function renderLeave(){
    var leaveList=DB.leaves.filter(function(l){return studentById(l.studentId)&&studentById(l.studentId).id.indexOf(filterClass+"-")===0;});
    var pending=leaveList.filter(function(l){return l.status==="待审批";}).length;
    var today=leaveList.filter(function(l){return l.startDate<=todayStr()&&l.endDate>=todayStr();}).length;
    var curMonth=todayStr().slice(0,7);
    var month=leaveList.filter(function(l){return l.startDate.slice(0,7)===curMonth;}).length;
    var sick=leaveList.filter(function(l){return l.type==="病假";}).length;
    var stats='<div class="grid-4" style="margin-bottom:16px"><div class="card data-card"><div class="data-num">'+pending+'</div><div class="data-sub">待审批</div></div><div class="card data-card"><div class="data-num">'+today+'</div><div class="data-sub">今日请假</div></div><div class="card data-card"><div class="data-num">'+month+'</div><div class="data-sub">本月人次</div></div><div class="card data-card"><div class="data-num">'+Math.round(sick/(leaveList.length||1)*100)+'%</div><div class="data-sub">病假占比</div></div></div>';
    // 月度请假统计（按时段分类）
    var monthLeaves=leaveList.filter(function(l){return l.startDate.slice(0,7)===curMonth&&l.status==="已批准";});
    var periodLabels={all:"全天",am:"上午",pm:"下午",recess:"大课间",t1:"一托",t2:"二托",breakfast:"早餐",lunch:"午餐"};
    var periodCounts={};
    monthLeaves.forEach(function(l){var p=l.leavePeriod||"all";periodCounts[p]=(periodCounts[p]||0)+1;});
    var periodHtml=Object.keys(periodLabels).map(function(p){return '<div class="data-card" style="padding:8px"><div class="data-num" style="font-size:20px;color:var(--primary)">'+(periodCounts[p]||0)+'</div><div class="data-sub">'+periodLabels[p]+'</div></div>';}).join("");
    // 学生请假次数排行
    var stuCounts={};
    monthLeaves.forEach(function(l){stuCounts[l.studentId]=(stuCounts[l.studentId]||0)+1;});
    var stuRank=Object.keys(stuCounts).map(function(sid){return {sid:sid,name:studentById(sid)?studentById(sid).name:"?",count:stuCounts[sid]};}).sort(function(a,b){return b.count-a.count;}).slice(0,5);
    var rankHtml=stuRank.length?stuRank.map(function(s,i){return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)"><span>'+(i+1)+'. '+esc(s.name)+'</span><b>'+s.count+' 次</b></div>';}).join(""):'<div class="muted" style="padding:8px">本月暂无请假记录</div>';
    var monthStats='<div class="card" style="padding:14px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>📊 '+curMonth+' 月度请假统计</b><div><span class="muted" style="font-size:12px;margin-right:8px">共 '+monthLeaves.length+' 人次</span><button class="btn btn-outline btn-sm" onclick="App.exportLeaveMonthStats()">'+ICONS.download+' 导出月度统计</button></div></div><div class="grid-4" style="grid-template-columns:repeat(auto-fit,minmax(80px,1fr));margin-bottom:12px">'+periodHtml+'</div><div style="border-top:1px solid var(--border);padding-top:8px"><b style="font-size:13px">请假次数 TOP5</b>'+rankHtml+'</div></div>';
    var rows=leaveList.map(function(l){
      var st=studentById(l.studentId);
      var badge=l.status==="待审批"?'<span class="tag amber">待审批</span>':(l.status==="已批准"?'<span class="tag green">已批准</span>':'<span class="tag red">已驳回</span>');
      if(l.temp)badge+=' <span class="tag" style="background:var(--primary-light);color:var(--primary)">临时</span>';
      var lp=l.leavePeriod||"all";
      var lpLabel=periodLabels[lp]||"全天";
      var act=l.status==="待审批"?'<button class="btn btn-soft btn-sm" onclick="App.approveLeave(\''+l.id+'\',true)">批准</button><button class="btn btn-danger btn-sm" onclick="App.approveLeave(\''+l.id+'\',false)">驳回</button>':'';
      return '<tr><td>'+(st?esc(st.name):"")+'</td><td>'+esc(l.type)+(l.outing?'（外出）':'')+'</td><td><span class="tag" style="background:var(--primary-light);color:var(--primary)">'+lpLabel+'</span></td><td>'+esc(l.reason)+'</td><td>'+l.startDate+' ~ '+l.endDate+'</td><td>'+badge+'</td><td style="text-align:right">'+act+'<button class="btn btn-soft btn-sm" onclick="App.exportLeaveDoc(\''+l.id+'\')">请假条</button><button class="icon-btn del" onclick="App.deleteLeave(\''+l.id+'\')">'+ICONS.trash+'</button></td></tr>';
    }).join("");
    if(!rows)rows='<tr><td colspan="7"><div class="empty">暂无请假记录</div></td></tr>';
    return stats
      +monthStats
      +'<div class="toolbar"><span class="count-pill">当前班级：'+esc(clsName(filterClass))+'</span><button class="btn btn-primary" onclick="App.addLeave()">'+ICONS.plus+' 请假登记</button><button class="btn btn-outline btn-sm" onclick="App.exportLeaveCSV()">'+ICONS.download+' 导出CSV</button></div>'
      +'<div class="card pad0"><table><thead><tr><th>学生</th><th>假别</th><th>时段</th><th>事由</th><th>起止</th><th>状态</th><th style="text-align:right">操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  function renderAffairs(){

  function renderSeat(){
    var seat=DB.seatSetting;var layout=seat.layout;
    var desk=seat.desk||1;
    // v1.4.1 防御：layout 行/列不足时自动补齐（防导入旧数据导致崩溃）
    if(!Array.isArray(layout))layout=seat.layout=[];
    while(layout.length<seat.rows)layout.push(new Array(seat.cols).fill(null));
    for(var _r=0;_r<layout.length;_r++){
      if(!Array.isArray(layout[_r]))layout[_r]=new Array(seat.cols).fill(null);
      while(layout[_r].length<seat.cols)layout[_r].push(null);
    }
    // 清理历史脏数据：超出实际列数的座位（三人桌等布局切换时可能误存）
    var colsC=seat.cols;
    for(var cr=0;cr<layout.length;cr++){
      if(layout[cr].length>colsC)layout[cr].length=colsC;
    }
    var aisles=seat.aisleCount||0;
    var seated={};layout.forEach(function(row){row.forEach(function(id){if(id)seated[id]=1;});});
    var cols=seat.cols;
    var gCols=desk>=2?Math.ceil(cols/desk):cols;
    var groups=aisles+1;
    var per=Math.max(1,Math.ceil(gCols/groups));
    var tpl=[];
    for(var gi=0;gi<gCols;gi++){if(gi>0&&gi%per===0&&gi<gCols)tpl.push('12px');tpl.push('1fr');}
    var grid='<div class="seat-grid'+(desk>=2?' desk-mode':'')+'" style="grid-template-columns:'+tpl.join(' ')+';max-width:'+(cols*84)+'px">';
    for(var r=0;r<seat.rows;r++){
      for(var c=0;c<gCols;c++){
        if(c>0&&c%per===0&&c<gCols)grid+='<div class="aisle"></div>';
        if(desk>=2){
          var deskCells='';
          for(var dc=0;dc<desk;dc++){
            var ci=c*desk+dc;
            if(ci>=cols)break; // 超出实际列数则不渲染该格（避免虚假列）
            var did=layout[r][ci]||null;
            deskCells+=seatCell(r,ci,did);
          }
          if(deskCells)grid+='<div class="desk">'+deskCells+'</div>';
        }else{
          grid+=seatCell(r,c,layout[r][c]||null);
        }
      }
    }
    grid+='</div>';
    var modeSeg='<span class="count-pill">模式</span><div class="seg" style="display:inline-flex"><button class="seg-btn'+(desk===1?' on':'')+'" style="'+(desk===1?'background:var(--blue);border-color:var(--blue);color:#fff':'')+'" onclick="App.setSeatMode(1)">单人座</button><button class="seg-btn'+(desk===2?' on':'')+'" style="'+(desk===2?'background:var(--blue);border-color:var(--blue);color:#fff':'')+'" onclick="App.setSeatMode(2)">双人座</button><button class="seg-btn'+(desk===3?' on':'')+'" style="'+(desk===3?'background:var(--blue);border-color:var(--blue);color:#fff':'')+'" onclick="App.setSeatMode(3)">三人座</button></div>';
    return '<div class="toolbar">'+modeSeg
      +'<button class="btn btn-soft btn-sm" onclick="App.openAutoSeatModal()">'+ICONS.refresh+' 智能排座</button>'
      +'<button class="btn btn-soft btn-sm" onclick="App.openSeatPlanModal()">🗂️ 座位方案</button>'
      +'<button class="btn btn-outline btn-sm" onclick="App.seatRows(-1)">− 行</button><button class="btn btn-outline btn-sm" onclick="App.seatRows(1)">+ 行</button>'
      +'<button class="btn btn-outline btn-sm" onclick="App.seatCols(-1)">− 列</button><button class="btn btn-outline btn-sm" onclick="App.seatCols(1)">+ 列</button>'
      +'<button class="btn btn-outline btn-sm" onclick="App.addAisle()">+ 过道</button><button class="btn btn-outline btn-sm" onclick="App.minusAisle()">− 过道</button>'
      +'<button class="btn btn-outline btn-sm" onclick="App.exportSeatPNG()">'+ICONS.download+' 导出图片</button>'
      +'<button class="btn btn-outline btn-sm" onclick="App.exportSeatCSV()">'+ICONS.download+' 导出CSV</button></div>'
      +'<div class="seat-wrap"><div class="podium">讲 台</div>'+grid+'</div>';
  }
  /* ===== Excel/CSV 批量导入 ===== */
  function parseCSV(text){
    text=text.replace(/^\uFEFF/,"");
    var out=[];
    text.split(/\r?\n/).forEach(function(l){
      if(l.trim()==="")return;
      var cells=[];var cur="";var inQ=false;
      for(var i=0;i<l.length;i++){
        var ch=l[i];
        if(inQ){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else{inQ=false;}}else{cur+=ch;}}
        else if(ch==='"'){inQ=true;}
        else if(ch===","){cells.push(cur.trim());cur="";}
        else{cur+=ch;}
      }
      cells.push(cur.trim());
      cells=cells.map(function(c){if(c.length>=2&&c.charAt(0)==='"'.toString()&&c.charAt(c.length-1)==='"')return c.slice(1,-1);return c;});
      if(cells.join("")!=="")out.push(cells);
    });
    return out;
  }

  function doImport(type,inp){
    var f=inp.files&&inp.files[0];if(!f){toast("未选择文件");return;}
    var rd=new FileReader();
    rd.onload=function(){
      var rows=parseCSV(rd.result);
      if(rows.length<2){toast("文件内容为空或格式不对");return;}
      var head=rows[0];
      var body=rows.slice(1).filter(function(r){return r.join("").trim()!=="";});
      if(type==="scores")doImportScores(head,body);
      else if(type==="homework")doImportHomework(head,body);
      else if(type==="discipline")doImportDiscipline(head,body);
      else if(type==="leave")doImportLeave(head,body);
    };
    rd.readAsText(f,"utf-8");
  }
  function findByNo(no){return DB.students.filter(function(s){return String(s.no)===String(no).trim();})[0]||null;}
  function doImportScores(head,body){
    var examName=(head&&head[0]&&head[0].trim()!=="考试名称"&&head[0].trim()!==""?head[0].trim():"导入考试");
    var subCols=head.slice(1).map(function(h){return h.trim();}).filter(function(h){return h!=="学号";});
    var e=DB.exams.find(function(x){return x.name===examName;});
    var exam;
    if(e){exam=e;}
    else{exam={id:uid(),name:examName,date:todayStr(),subjects:subCols.map(function(sb){return {name:sb,full:100};}),total:subCols.length*100};DB.exams.push(exam);}
    var added=0,skipped=0,rowPre=[];
    body.forEach(function(r){
      var no=r[0];var st=findByNo(no);
      if(!st){skipped++;return;}
      var subs=[];subCols.forEach(function(sb,ci){subs.push({name:sb,score:parseFloat(r[ci+1])||0});});
      var total=roundScore(subs.reduce(function(a,b){return a+b.score;},0));
      DB.scores=DB.scores.filter(function(x){return !(x.examId===exam.id&&x.studentId===st.id);});
      DB.scores.push({id:uid(),examId:exam.id,studentId:st.id,subjects:subs,total:total,rank:0});
      added++;rowPre.push({st:st,total:total});
    });
    var all=DB.scores.filter(function(x){return x.examId===exam.id;}).sort(function(a,b){return b.total-a.total;});
    all.forEach(function(x,i){x.rank=i+1;});
    syncScoreFromExams(rowPre.map(function(x){return x.st.id;}));
    save();closeModal();render();toast("成绩导入完成：新增 "+added+" 条"+(skipped?"，跳过未找到学生 "+skipped+" 条":"")+"，考试「"+examName+"」");
  }
  function doImportHomework(head,body){
    var added=0,skipped=0;
    body.forEach(function(r){
      var sub=r[0],title=r[1],deadline=r[2]||"",missStr=r[3]||"";
      var clsStu=DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;});
      var missing=missStr.split(/[,;，；]/).map(function(x){return x.trim();}).filter(Boolean).map(function(no){var st=findByNo(no);return st?st.id:null;}).filter(Boolean);
      var submitted=clsStu.filter(function(s){return missing.indexOf(s.id)<0;}).map(function(s){return s.id;});
      if(!title){skipped++;return;}
      DB.homework.push({id:uid(),subject:sub||"其他",requirement:title,deadline:deadline||"本周",submitted:submitted,late:[],missing:missing});
      added++;
    });
    save();closeModal();render();toast("作业导入完成：新增 "+added+" 条"+(skipped?"，跳过空行 "+skipped+" 条":""));
  }

  // v2.0.3.5 课表图片导出（纯 canvas 绘制版）：
  // 之前用 SVG foreignObject 内嵌 HTML → Chrome 视为跨源导致 canvas 被污染（Tainted canvas）无法 toDataURL。
  // 改为直接用 canvas 按课表数据绘制（配色/描边/字体与页面一致），纯本地绘制永不污染，零外部依赖。
  function exportTimetablePNG(){
    var tt=DB.timetable;
    var days=["周一","周二","周三","周四","周五"];
    var view=mtab==="tt_my"?"my":"class";
    var myTea=DB.setting.teacherName||"李老师";
    var cssv=function(n){return (getComputedStyle(document.documentElement).getPropertyValue(n)||"").trim();};
    var _border=cssv("--border")||"#E2E8F0";
    var _bg=cssv("--bg")||"#F8FAFC";
    var _t2=cssv("--t2")||"#334155";
    var firstColW=84,colW=150,rowH=48,headH=42,pad=18,bottomH=50;
    var w=pad*2+firstColW+days.length*colW;
    var h=pad*2+headH+tt.times.length*rowH+bottomH;
    var cv=document.createElement("canvas");
    cv.width=w;cv.height=h;
    var g=cv.getContext("2d");
    g.fillStyle="#FFFFFF";g.fillRect(0,0,w,h);
    g.textBaseline="middle";
    // 标题
    g.fillStyle="#1A2333";g.font="bold 17px 'Microsoft YaHei'";g.textAlign="center";
    g.fillText(clsName(filterClass)+" 课程表"+(view==="my"?" · 我的授课":""),w/2,pad+14);
    var x0=pad,y0=pad+32;
    // 表头：浅蓝底 + 深蓝加粗字，导出图片清晰可辨
    var _headBg="#E8F0FE",_headTxt="#1D4ED8";
    g.fillStyle=_headBg;g.fillRect(x0,y0,firstColW,headH);
    g.strokeStyle=_border;g.lineWidth=1;g.strokeRect(x0,y0,firstColW,headH);
    g.fillStyle=_headTxt;g.font="bold 14px 'Microsoft YaHei'";g.textAlign="center";
    g.fillText("节次/时间",x0+firstColW/2,y0+headH/2);
    for(var di=0;di<days.length;di++){
      var dx=x0+firstColW+di*colW;
      g.fillStyle=_headBg;g.fillRect(dx,y0,colW,headH);g.strokeRect(dx,y0,colW,headH);
      g.fillStyle=_headTxt;g.fillText(days[di],dx+colW/2,y0+headH/2);
    }
    // 表头下分隔线加粗
    g.strokeStyle="#B7C6E4";g.lineWidth=2;
    g.beginPath();g.moveTo(x0,y0+headH);g.lineTo(x0+firstColW+days.length*colW,y0+headH);g.stroke();
    g.lineWidth=1;
    // 数据行
    tt.times.forEach(function(t,pi){
      var ry=y0+headH+pi*rowH;
      g.fillStyle="#FAFBFC";g.fillRect(x0,ry,firstColW,rowH);g.strokeRect(x0,ry,firstColW,rowH);
      g.fillStyle="#475569";g.font="12px 'Microsoft YaHei'";g.textAlign="center";
      g.fillText(t.period,x0+firstColW/2,ry+rowH/2-9);
      g.fillStyle="#94A3B8";g.font="11px sans-serif";
      g.fillText(t.start+"-"+t.end,x0+firstColW/2,ry+rowH/2+11);
      tt.schedule.forEach(function(row,di){
        var c=row[pi];if(!c)c={subject:"",teacher:"",note:""};
        var dx=x0+firstColW+di*colW;
        var mine=view==="my"&&c.teacher&&c.teacher.indexOf(myTea)>=0;
        var col=DB.setting.subjectColors[c.subject]||"#CBD5E1";
        var bg=c.bg||(col+"22");
        var fg=c.fg||col;
        g.fillStyle=bg;g.fillRect(dx,ry,colW,rowH);
        g.strokeStyle=_border;g.strokeRect(dx,ry,colW,rowH);
        if(mine){g.strokeStyle="#2B7FFF";g.lineWidth=2;g.strokeRect(dx+1,ry+1,colW-2,rowH-2);g.lineWidth=1;}
        if(c.subject&&c.subject!=="—"){
          g.fillStyle=fg;g.font="600 14px 'Microsoft YaHei'";g.textAlign="center";
          g.fillText(c.subject,dx+colW/2,ry+rowH/2-8);
          g.fillStyle="#64748B";g.font="11px 'Microsoft YaHei'";
          g.fillText(c.teacher||c.note||"",dx+colW/2,ry+rowH/2+12);
        }
      });
    });
    // 底部注脚
    g.fillStyle="#94A3B8";g.font="11px sans-serif";g.textAlign="center";
    g.fillText(clsName(filterClass)+" · "+todayStr()+" · 由班主任智能工作台导出",w/2,h-16);
    try{
      var a=document.createElement("a");
      a.href=cv.toDataURL("image/png");
      a.download="课程表-"+clsName(filterClass)+"-"+(view==="my"?"我的授课":"班级全局")+".png";
      a.click();
      toast("已导出课表图片");
    }catch(e){toast("导出失败："+e.message);}
  }

  function saveSwap(){
    var tt=DB.timetable;
    var di=parseInt(document.getElementById("sw_day").value,10);
    var pi=parseInt(document.getElementById("sw_period").value,10);
    var cell=tt.schedule[di][pi]||{subject:"",teacher:"",note:""};
    var fromSubject=cell.subject||"—",fromTeacher=cell.teacher||"—";
    var subSel=document.getElementById("sw_sub").value;
    var toSubject=subSel?subSel:(cell.subject||"—");
    var toTeacher=document.getElementById("sw_tea").value.trim()||cell.teacher||"";
    DB.lessonSwaps=DB.lessonSwaps||[];
    DB.lessonSwaps.push({id:uid(),type:document.getElementById("sw_type").value,date:todayStr(),period:tt.times[pi]?tt.times[pi].period:"第"+(pi+1)+"节",day:di,periodIdx:pi,fromSubject:fromSubject,fromTeacher:fromTeacher,toSubject:toSubject,toTeacher:toTeacher,note:document.getElementById("sw_note").value.trim(),orig:clone(cell)});
    tt.schedule[di][pi]={subject:toSubject,teacher:toTeacher,note:(cell.note||"")};
    save();closeModal();render();toast("已"+DB.lessonSwaps[DB.lessonSwaps.length-1].type+"并更新课表");
  }
  function undoSwap(id){
    confirm2("撤销该条调课记录并恢复原课表？",function(){
    var s=(DB.lessonSwaps||[]).filter(function(x){return x.id===id;})[0];
    if(!s)return;
    var tt=DB.timetable;
    if(tt.schedule[s.day]&&tt.schedule[s.day][s.periodIdx])tt.schedule[s.day][s.periodIdx]=clone(s.orig||{subject:"",teacher:"",note:""});
    DB.lessonSwaps=DB.lessonSwaps.filter(function(x){return x.id!==id;});
    save();render();toast("已撤销调课并恢复原课表");
    });
  }

  function addMin(t,m){var p=String(t).split(":");var d=new Date(2000,0,1,parseInt(p[0],10)||0,parseInt(p[1],10)||0);d.setMinutes(d.getMinutes()+m);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
  function addPeriod(){
    var tt=DB.timetable;var n=tt.times.length;
    var s=tt.times[n-1]?(tt.times[n-1].end||"17:00"):"08:00";
    var start=addMin(s,10),end=addMin(start,45);
    tt.times.push({period:"第"+(n+1)+"节",start:start,end:end});
    tt.schedule.forEach(function(row){row.push({subject:"",teacher:"",note:""});});
    save();render();toast("已添加「"+tt.times[n].period+"」("+start+"-"+end+")，点击节次列可修改时间");
  }

  function renderContacts(){
    var list=DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;});
    if(search){var q=search.toLowerCase();list=list.filter(function(s){return s.name.toLowerCase().indexOf(q)>=0||(s.father&&s.father.toLowerCase().indexOf(q)>=0)||(s.mother&&s.mother.toLowerCase().indexOf(q)>=0)||(s.fatherPhone&&s.fatherPhone.indexOf(q)>=0)||(s.motherPhone&&s.motherPhone.indexOf(q)>=0);});}
    function parentBlock(role,who,name,phone,note,id){
      var phKey=who==="f"?"phf_":"phm_";
      var noteKey=who==="f"?"father":"mother";
      var row='<div class="cc-row"><span class="cc-role">'+role+'</span><span class="cc-nm">'+esc(name||"—")+'</span>'+(phone?'<span class="cc-ph" id="'+phKey+id+'">'+desensPhone(phone)+'</span> <a class="link" data-on="0" title="点击显示/隐藏完整号码" onclick="App.togglePhone(\''+id+'\',this,\''+who+'\')">👁</a> <a class="link" onclick="App.copyPhone(\''+phone+'\')">复制</a>':"")+'</div>';
      var noteInput='<div class="cc-note"><span class="cc-note-label">备注</span><input class="contact-note" value="'+esc(note||"")+'" onchange="App.saveContactNote(\''+id+'\',\''+noteKey+'\',this.value)"></div>';

    var cards=list.map(function(s){

    }).join("");

  function exportQualityCSV(){var rows=[["姓名","班级","品德","学业","身心","艺术","实践","备注"]];DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;}).forEach(function(s){var q=(DB.quality&&DB.quality[s.id])||{};rows.push([s.name,clsName(s.id.split("-")[0]),q.品德!=null?q.品德:80,q.学业!=null?q.学业:scoreRate(s),q.身心!=null?q.身心:80,q.艺术!=null?q.艺术:75,q.实践!=null?q.实践:75,q.note||""]);});exportCSV("五育评价-"+clsName(filterClass)+".csv",rows);}
  function renderABCD(){
    var cs=DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;});
    var w=DB.setting.evalWeights;var st=studentById(mstate.studentId&&cs.some(function(s){return s.id===mstate.studentId;})?mstate.studentId:(cs[0]&&cs[0].id));
    var opts='<select class="select" onchange="App.pickStudent(this.value)">'+cs.map(function(s){return '<option value="'+s.id+'"'+(s.id===(st&&st.id)?" selected":"")+'>'+esc(s.name)+'</option>';}).join("")+'</select>';
    var teacherScore=st?Math.round(st.behavior):0;var examScore=st?scoreRate(st):0;
    var total=Math.round(teacherScore*w.teacher/100+examScore*w.exam/100);
    var sorted=cs.slice().sort(function(a,b){return (b.behavior*w.teacher/100+scoreRate(b)*w.exam/100)-(a.behavior*w.teacher/100+scoreRate(a)*w.exam/100);});
    var pct=sorted.indexOf(st)/sorted.length;
    var level=pct<0.2?"A":(pct<0.6?"B":(pct<0.8?"C":"D"));
    var labels={A:"表扬优秀、鼓励继续",B:"肯定良好、建议提升",C:"指出不足、巩固基础",D:"重点关注、加强训练"};

    return '<div class="toolbar"><span class="count-pill">'+esc(clsName(filterClass))+'</span>'+opts+'</div><div class="card"><div class="card-head"><h3>'+esc(st.name)+' 综合素质评价</h3></div>'
      +'<div class="kv"><span class="k">教师打分（行为分）</span><b>'+teacherScore+'</b></div>'
      +'<div class="kv"><span class="k">期末成绩</span><b>'+examScore+'</b></div>'
      +'<div class="kv"><span class="k">权重（教师 '+w.teacher+'% / 成绩 '+w.exam+'%）</span><b>综合分 '+total+'</b></div>'
      +'<div class="kv"><span class="k">等级（前20%A/21-60%B/61-80%C/后20%D）</span><b><span class="tag green">'+level+'</span> '+labels[level]+'</b></div>'
      +'<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="App.saveEval(\''+st.id+'\','+teacherScore+','+examScore+','+total+',\''+level+'\')">保存评价</button></div>';
  }
  function renderGrowth(){
    var cs=DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;});
    var sid=mstate.studentId&&cs.some(function(s){return s.id===mstate.studentId;})?mstate.studentId:(cs[0]&&cs[0].id);
    var st=studentById(sid);if(!st)return '<div class="empty">当前班级暂无学生</div>';
    var opts='<select class="select" onchange="App.pickStudent(this.value)">'+cs.map(function(s){return '<option value="'+s.id+'"'+(s.id===sid?" selected":"")+'>'+esc(s.name)+'</option>';}).join("")+'</select>';
    // 该生历次考试成绩
    var exams=classExams().slice().sort(function(a,b){var da=a.date||"9999-12-31",db=b.date||"9999-12-31";return da<db?-1:(da>db?1:0);});
    var rows=exams.map(function(e){
      var r=DB.scores.find(function(x){return x.examId===e.id&&x.studentId===sid;});
      return {exam:e,score:r};
    }).filter(function(x){return x.score;});
    // 总分趋势
    var totals=rows.map(function(r){return r.score.total;});
    var totalLabels=rows.map(function(r){return r.exam.name.slice(0,4);});
    var totalLine=rows.length?lineChart(totals,totalLabels,"var(--primary)"):'<div class="empty">暂无成绩记录，请先录入考试</div>';
    // 科目列表（chips）
    var subjects=[];
    rows.forEach(function(r){r.exam.subjects.forEach(function(sb){if(subjects.indexOf(sb.name)<0)subjects.push(sb.name);});});
    var gSub=mstate.gSub&&subjects.indexOf(mstate.gSub)>=0?mstate.gSub:subjects[0];
    var subChips=subjects.map(function(sb){var c=subjectColorOf(sb);return '<button class="sub-chip'+(sb===gSub?' on':'')+'" onclick="App.pickSubject(\''+sb+'\')"><span class="dot" style="background:'+c+'"></span>'+esc(sb)+'</button>';}).join("");
    // 单科趋势
    var subLine="",subTable="";
    if(gSub){
      var subVals=rows.map(function(r){var f=r.score.subjects.find(function(x){return x.name===gSub;});return f?f.score:0;});
      var subFull=null;rows.forEach(function(r){var sb=r.exam.subjects.find(function(x){return x.name===gSub;});if(sb)subFull=sb.full;});
      subLine=rows.length?lineChart(subVals,totalLabels,"var(--teal)"):'<div class="empty">暂无数据</div>';
      subTable=rows.map(function(r,i){var f=r.score.subjects.find(function(x){return x.name===gSub;});return '<tr><td>'+esc(r.exam.name)+'</td><td>'+r.exam.date+'</td><td><b>'+((f&&f.score)||0)+'</b></td><td>'+(subFull||"—")+'</td></tr>';}).join("");
    }
    // 全部成绩明细表（考试 × 科目）
    var allHead=exams.length?'<tr><th>考试</th><th>日期</th>'+exams[0].subjects.map(function(sb){return '<th>'+esc(sb.name)+(sb.full&&sb.full!==100?' <span class="muted" style="font-size:10px">/'+sb.full+'</span>':"")+'</th>';}).join("")+'<th>总分</th></tr>':'<tr><th>考试</th><th>日期</th><th>成绩</th></tr>';
    var allRows=rows.map(function(r){
      var cells=r.exam.subjects.map(function(sb){var f=r.score.subjects.find(function(x){return x.name===sb.name;});return '<td>'+(f?f.score:"—")+'</td>';}).join("");
      return '<tr><td>'+esc(r.exam.name)+'</td><td class="muted">'+r.exam.date+'</td>'+cells+'<td><b>'+r.score.total+'</b>'+(r.exam.total?'<span class="muted"> / '+r.exam.total+'</span>':"")+'</td></tr>';
    }).join("");
    var allTable=rows.length?'<div class="scroll-x"><table class="score-tbl"><thead>'+allHead+'</thead><tbody>'+allRows+'</tbody></table></div>':'<div class="empty">暂无成绩记录，请先在「成绩管理」录入考试</div>';
    var disc=DB.discipline.filter(function(d){return d.studentId===sid;}).map(function(d){return '<div class="rec-row">['+d.date+'] '+esc(d.type)+'：'+esc(d.description)+'（'+esc(d.handling)+'）</div>';}).join("")||'<div class="muted">暂无</div>';
    var talks=DB.talks.filter(function(t){return t.studentId===sid;}).map(function(t){return '<div class="rec-row">['+t.date+'] '+esc(t.type)+'：'+esc(t.content)+'</div>';}).join("")||'<div class="muted">暂无</div>';
    var comms=DB.communications.filter(function(c){return c.studentId===sid;}).map(function(c){return '<div class="rec-row">['+c.date+'] '+esc(c.method)+'：'+esc(c.content)+'</div>';}).join("")||'<div class="muted">暂无</div>';
    var honors=DB.honors.filter(function(h){return h.studentId===sid;}).map(function(h){return '<div class="rec-row">'+esc(h.competition)+'（'+esc(h.level)+'）</div>';}).join("")||'<div class="muted">暂无</div>';
    // 增值性评价区块（v1.4.1）
    var vaStageHtml="";
    try{
      var va=vaStage(sid);
      if(va){
        var b=va.base;
        var subRows=va.subs.map(function(x){
          return '<tr><td>'+esc(x.name)+'</td><td>'+(x.base!=null?x.base:"—")+'</td><td>'+(x.cur!=null?x.cur:"—")+'</td><td>'+vaBadge(x.va)+'</td></tr>';
        }).join("");
        var vaTrend=rows.map(function(r){return {exam:r.exam,score:r.score,va:vaScoreOf(b.total,r.score.total)};});
        var vaLine=vaTrend.length?lineChart(vaTrend.map(function(x){return x.va;}),vaTrend.map(function(x){return x.exam.name.slice(0,4);}),"var(--purple)"):'<div class="empty">暂无</div>';
        var vaTagColor=va.overall==="进步显著"?"green":(va.overall==="稳步提升"?"teal":(va.overall==="保持稳定"?"blue":"red"));
        vaStageHtml='<div class="card"><div class="card-head"><h3>增值性评价</h3><span class="muted" style="font-size:12px">基线：'+esc(b.examName)+'（'+b.date+'）总分 '+b.total+'</span></div>'
          +'<div class="kv"><span class="k">本次（'+esc(va.examName)+' '+va.date+'）</span><span class="v">总分 '+va.total+' · 增值 '+vaBadge(va.va)+' · 平均增值 <b>'+va.avg+'</b> <span class="tag '+vaTagColor+'" style="margin-left:6px">'+va.overall+'</span></span></div>'
          +'<div class="sub-sec"><h4>增值趋势（历次考试 vs 基线）</h4>'+vaLine+'</div>'
          +'<div class="sub-sec"><h4>各科增值（最近一次 vs 基线）</h4><div class="scroll-x"><table class="score-tbl"><thead><tr><th>科目</th><th>基线分</th><th>本次</th><th>增值</th></tr></thead><tbody>'+subRows+'</tbody></table></div></div>'
          +'<div class="hint">说明：以第一次考试为基线，本次较基线高 '+vaPct()+'% 内记 +1、超 +'+vaPct()+'% 记 +2；低 '+vaPct()+'% 内记 -1、超 -'+vaPct()+'% 记 -2。可在「数据管理-系统设置」调整档位。</div>'
          +'</div>';
      }
    }catch(e){}
    return '<div class="toolbar">'+opts+'</div>'
      +(vaStageHtml?vaStageHtml+'<div style="margin-top:16px"></div>':"")
      +'<div class="card"><div class="card-head"><h3>'+esc(st.name)+' · 详细成绩</h3></div>'+allTable+'</div>'
      +'<div class="grid-2" style="margin-top:16px">'
        +'<div class="card"><div class="card-head"><h3>总分趋势</h3><span class="muted" style="font-size:12px">各科之和</span></div>'+totalLine+'</div>'
        +'<div class="card"><div class="card-head"><h3>单科趋势</h3></div><div class="sub-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">'+subChips+'</div>'+subLine+(subTable?'<div class="scroll-x" style="margin-top:8px"><table><thead><tr><th>考试</th><th>日期</th><th>'+esc(gSub)+'</th><th>满分</th></tr></thead><tbody>'+subTable+'</tbody></table></div>':"")+'</div>'
      +'</div>'
      +'<div class="grid-2" style="margin-top:16px">'
        +'<div class="card"><div class="sub-sec"><h4>违纪记录</h4>'+disc+'</div><div class="sub-sec"><h4>谈话记录</h4>'+talks+'</div></div>'
        +'<div class="card"><div class="sub-sec"><h4>家校沟通</h4>'+comms+'</div><div class="sub-sec"><h4>荣誉表彰</h4>'+honors+'</div></div>'
      +'</div>';
  }

  function renderTasks(){
    var tabs=["待办","日程","留痕","谈话"];
    var th='<div class="mtab">'+tabs.map(function(t){return '<button class="'+(mtab===t?"on":"")+'" onclick="App.setMtab(\''+t+'\')">'+t+'</button>';}).join("")+'</div>';
    if(mtab==="日程")return th+renderSchedule();
    if(mtab==="留痕")return th+renderWorkLogs();
    if(mtab==="谈话")return th+renderTalks();
    var qs=[{k:"urgent",t:"紧急重要",c:"var(--red)"},{k:"important",t:"重要不紧急",c:"var(--amber)"},{k:"normal",t:"紧急不重要",c:"var(--blue)"},{k:"noturgent",t:"不紧急不重要",c:"var(--t3)"}];

  // 工作清单数据采集（智能助手与仪表盘模块共用；clsId 为空时用当前过滤班级）
  function collectRemindLines(kind,clsId){
    var today=todayStr();
    var isDay=kind==="day";
    var weekEnd=new Date();weekEnd.setDate(weekEnd.getDate()+7);
    var weekEndStr=localDateStr(weekEnd);
    var lines=[];
    function add(prio,icon,text){lines.push({prio:prio,icon:icon,text:text});}
    function inWeek(d){return d>=today&&d<=weekEndStr;}
    // 1. 周末未返校（安全红线，最高优先级）
    DB.weekendOut.filter(function(w){return !w.confirmed;}).forEach(function(w){var st=studentById(w.studentId);add(0,"🔴","[未返校] "+(st?st.name:"")+" "+w.date+" "+w.leaveTime+"离校，尚未确认返校");});
    // 2. 请假待审批
    DB.leaves.filter(function(l){return l.status==="待审批";}).forEach(function(l){var st=studentById(l.studentId);add(1,"🟠","[请假待审批] "+(st?st.name:"")+" "+l.type+" "+l.startDate+"~"+l.endDate+" · "+l.reason);});
    // 3. 今日考勤异常（大课间 recess 独立记录，不计入出勤提醒）
    var attAbn=DB.attendance.filter(function(a){return a.date===today&&a.status!=="present"&&(a.period||"all")!=="recess";});
    if(attAbn.length){var parts=[];var lateN=attAbn.filter(function(a){return a.status==="late";}).length;var leaveN=attAbn.filter(function(a){return a.status==="leave";}).length;var absentN=attAbn.filter(function(a){return a.status==="absent";}).length;if(lateN)parts.push(lateN+"人迟到");if(leaveN)parts.push(leaveN+"人请假");if(absentN)parts.push(absentN+"人旷课");add(2,"🟡","[今日考勤] "+parts.join("，")+"，请及时跟进");}
    // 4. 作业未缴（按科目明细）
    var miss=0;var missSubs=[];DB.homework.forEach(function(h){if(h.missing&&h.missing.length){miss+=h.missing.length;missSubs.push(h.subject+"("+h.missing.length+"人)");}});if(miss)add(3,"🟡","[作业未缴] 累计"+miss+"人次（"+missSubs.join("、")+"），请尽快催收");
    // 5. 待办事项（逾期优先）
    DB.todos.filter(function(t){return !t.completed;}).forEach(function(t){var od=/今天|昨天|逾期/.test(t.deadline)||daysBetween(t.deadline)<=0;add(od?1:4,od?"🔴":"⭕","[待办"+(od?"·逾期":"")+"] "+t.content+"（"+t.deadline+" · "+t.priority+"）");});
    // 6. 日程安排
    DB.schedule.filter(function(s){if(s.completed)return false;return isDay?s.date===today:inWeek(s.date);}).forEach(function(s){add(3,"🔵","[日程] "+s.title+"（"+s.date+" · "+s.duration+"h"+(s.completed?" · 已完成":"")+"）");});
    // 7. 倒计时（考试/活动，本周内）
    var cdEvs=DB.countdownEvents.concat(classExams().map(function(e){return {name:e.name,date:e.date,icon:"📝"};})).filter(function(e){return e.date&&inWeek(e.date);});
    cdEvs.forEach(function(e){var d=daysBetween(e.date);add(d<=1?1:3,e.icon||"⏳","[倒计时] "+e.name+"（"+(d===0?"今天":d+"天后")+" · "+e.date+"）");});
    // 8. 今日值日检查
    var weekNames=["周日","周一","周二","周三","周四","周五","周六"];var tw=weekNames[new Date().getDay()];
    if(tw!=="周日"&&tw!=="周六"){var dd=DB.dutyRoster.days.find(function(d){return d.day===tw;});if(dd){var empty=0;["早读","课间","晚自修","卫生区"].forEach(function(sl){if(!(dd.slots[sl]&&dd.slots[sl].length))empty++;});if(empty)add(4,"📋","[值日] 今日"+tw+"有"+empty+"项值日空缺，请检查安排");}}
    // 9. 今日调课
    (DB.lessonSwaps||[]).filter(function(s){return s.date===today;}).forEach(function(s){add(3,"🔄","[调课] "+s.type+"：第"+(s.periodIdx+1)+"节 "+(s.fromSubject||"")+"→"+(s.toSubject||"")+(s.note?" · "+s.note:""));});
    // 10. 评语待写（指定班级）
    var cls=clsId||filterClass;
    var classStus=DB.students.filter(function(s){return s.id.indexOf(cls+"-")===0;});
    var evalDone=DB.evaluations.filter(function(e){return classStus.some(function(s){return s.id===e.studentId;});}).map(function(e){return e.studentId;});
    var evalMiss=classStus.filter(function(s){return evalDone.indexOf(s.id)<0;}).length;
    if(evalMiss)add(4,"📝","[评语] 当前班级还有"+evalMiss+"名学生未写评语");
    // 11. 资助待处理
    DB.specialAid.filter(function(a){return a.status==="待审核"||a.status==="材料收集中";}).forEach(function(a){var st=studentById(a.studentId);add(4,"💰","[资助] "+(st?st.name:"")+" "+a.type+" "+a.amount+"元 · "+a.status);});
    // 12. 突发事件（今日/本周，高优先级）
    var incN=(DB.incidents||[]).filter(function(x){return isDay?(x.date===today):inWeek(x.date);}).length;
    if(incN)add(1,"🚨","[突发事件] "+(isDay?"今日":"本周")+" "+incN+" 起待跟进");
    // 13. 家访（今日/本周）
    var hvN=(DB.homeVisits||[]).filter(function(x){return isDay?(x.date===today):inWeek(x.date);}).length;
    if(hvN)add(3,"🏠","[家访] "+(isDay?"今日":"本周")+" "+hvN+" 户待访");
    // 14. 家长会（今日/本周）
    var pmN=(DB.parentMeetings||[]).filter(function(x){return isDay?(x.date===today):inWeek(x.date);}).length;
    if(pmN)add(2,"👨‍👩‍👧","[家长会] "+(isDay?"今日":"本周")+" "+pmN+" 场");
    // 排序：按优先级
    lines.sort(function(a,b){return a.prio-b.prio;});
    if(!lines.length)add(5,"✅",isDay?"今日无待办事项，轻松～":"本周暂无待办事项");

    var selectedExamId=mstate.teachExamId||(allExams[0]?allExams[0].id:"");

    var mkCount={};(DB.mistakes||[]).forEach(function(m){if(!m.reviewed){var k=m.knowledge||"未标注";mkCount[k]=(mkCount[k]||0)+1;}});

      return '<div class="card"><div class="stat"><span class="dot" style="background:'+(DB.setting.subjectColors[su]||"#2B7FFF")+'"></span><div class="meta"><div class="k">'+esc(su)+' 平均分</div><div class="v">'+avg+' <span class="muted" style="font-size:12px">及格率 '+passRate+'%</span></div></div></div></div>';
    }).join("");

    }).join("");
    // 高频错题
    var mkRows=mkTop.map(function(k){return '<div class="rec-row"><span class="tag red">'+mkCount[k]+' 题待订正</span> <b>'+esc(k)+'</b></div>';}).join("")||'<div class="empty">暂无待订正错题</div>';

    var lowNames=low.slice(0,6).map(function(st){return '<span class="tag red">'+esc(st.name)+'</span>';}).join(" ")||'<span class="muted">无</span>';
    var topNames=top.slice(0,6).map(function(st){return '<span class="tag green">'+esc(st.name)+'</span>';}).join(" ")||'<span class="muted">无</span>';
    // 近期考试
    var examRows=upcoming.map(function(e){return '<div class="rec-row"><span class="pill amber">📅</span> <b>'+esc(e.name)+'</b> <span class="muted">'+e.date+'</span></div>';}).join("")||'<div class="empty">暂无近期考试安排</div>';
    return '<div class="toolbar"><span class="count-pill">'+esc(clsName(filterClass))+' · 教学数据总览</span><span style="display:flex;align-items:center;gap:8px"><span class="count-pill">选择考试：</span>'+examSelect+'</span></div>'
      +'<div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+avgCards+examCard+'</div>'
      +'<h3 style="margin:18px 0 10px;font-size:14px">📋 作业完成情况</h3>'
      +'<div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+(hwCards||'<div class="card"><div class="empty">暂无作业数据</div></div>')+'</div>'
      +'<div class="grid-2" style="margin-top:16px"><div class="card"><div class="card-head"><h3>高频错题 TOP（待订正）</h3><button class="btn btn-soft btn-sm" onclick="App.setMtab(\'错题\')">去错题本</button></div>'+mkRows+'</div>'
      +'<div class="card"><div class="card-head"><h3>近期考试提醒</h3><button class="btn btn-soft btn-sm" onclick="App.setMtab(\'成绩\')">去成绩管理</button></div>'+examRows+'</div></div>'

  function saveBookmark(id){

  function legalHolidays(){
    var y=new Date().getFullYear();
    var LUNAR={spring:{2026:"2026-02-17",2027:"2027-02-06",2028:"2028-01-26",2029:"2029-02-13"},qingming:{2026:"2026-04-05",2027:"2027-04-05",2028:"2028-04-04",2029:"2029-04-04"},duanwu:{2026:"2026-06-19",2027:"2027-06-09",2028:"2028-05-28",2029:"2029-06-16"},midautumn:{2026:"2026-09-25",2027:"2027-09-15",2028:"2028-10-03",2029:"2029-09-22"}};
    var ev=[];
    for(var i=0;i<3;i++){
      var yy=y+i;
      ev.push({n:"元旦",d:yy+"-01-01",icon:"🎉"},{n:"劳动节",d:yy+"-05-01",icon:"🛠️"},{n:"教师节",d:yy+"-09-10",icon:"🍎"},{n:"国庆节",d:yy+"-10-01",icon:"🎆"});
      ["spring","qingming","duanwu","midautumn"].forEach(function(k){
        var d=LUNAR[k][yy];
        if(d)ev.push({n:k==="spring"?"春节":(k==="qingming"?"清明节":(k==="duanwu"?"端午节":"中秋节")),d:d,icon:k==="spring"?"🧧":(k==="qingming"?"🍃":(k==="duanwu"?"🛶":"🥮"))});
      });
    }
    return ev;
  }
  function holidayCommon(){
    var today=todayStr();
    var evAll=legalHolidays().filter(function(h){return h.d>=today;}).sort(function(a,b){return a.d<b.d?-1:1;});
    var custom=(DB.holidays||[]).map(function(h){return {n:h.name,d:h.date};}).filter(function(h){return h.d>=today;}).sort(function(a,b){return a.d<b.d?-1:1;});
    var all=evAll.concat(custom).sort(function(a,b){return a.d<b.d?-1:1;});
    return {today:today,next:all[0]||null,custom:custom};
  }
  function rangeSelHtml(){
    return '<select class="select" style="width:auto;padding:6px 10px" onchange="App.setHolidayRange(this.value)"><option value="quarter"'+(mstate.holidayRange==="quarter"?" selected":"")+'>近三个月</option><option value="half"'+(mstate.holidayRange==="half"?" selected":"")+'>近半年</option><option value="year"'+(mstate.holidayRange==="year"?" selected":"")+'>近一年</option></select>';

  function legalRowsHtml(){
    var today=todayStr();mstate.holidayRange=mstate.holidayRange||"quarter";
    var rangeMonths={quarter:3,half:6,year:12}[mstate.holidayRange]||3;
    var lim=new Date();lim.setMonth(lim.getMonth()+rangeMonths);lim.setHours(0,0,0,0);
    var limitStr=localDateStr(lim);
    var ev=legalHolidays().filter(function(h){return h.d>=today&&h.d<=limitStr;}).sort(function(a,b){return a.d<b.d?-1:1;});
    var dayTag=function(dd){var n=daysBetween(dd);return n<=7?'<span class="tag red">还剩 '+n+' 天</span>':(n<=30?'<span class="tag amber">还剩 '+n+' 天</span>':'<span class="tag blue">还剩 '+n+' 天</span>');};
    return ev.map(function(h){return '<div class="rec-row"><span class="pill">法定</span> <b>'+(h.icon?h.icon+" ": "")+esc(h.n)+'</b> <span class="muted">'+h.d+'</span> '+dayTag(h.d)+'</div>';}).join("")||'<div class="muted">所选时间范围内暂无法定节假日，可切换「近半年 / 近一年」查看</div>';

  function breaksCardHtml(){
    var st0=DB.setting;

      var html='<div style="padding:6px 0;border-bottom:1px dashed var(--border)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:13px">'+name+'</span>';

  function openStudent(id){

    var tags=st.tags.length?st.tags.map(function(t){return '<span class="tag blue">'+esc(t)+'</span>';}).join(" "):'<span class="muted">无</span>';
    var attc=st.attendance<0.92?"var(--red)":(st.attendance<0.97?"var(--amber)":"var(--green)");
    var _stuAttAll=DB.attendance.filter(function(a){return a.studentId===id&&!a.night&&(a.period||"all")==="all";});
    var _stuAttAm=DB.attendance.filter(function(a){return a.studentId===id&&!a.night&&a.period==="am";});
    var _stuAttPm=DB.attendance.filter(function(a){return a.studentId===id&&!a.night&&a.period==="pm";});
    var _stuRateAm=_stuAttAm.length?(_stuAttAm.filter(function(a){return a.status==="present";}).length/_stuAttAm.length):null;
    var _stuRatePm=_stuAttPm.length?(_stuAttPm.filter(function(a){return a.status==="present";}).length/_stuAttPm.length):null;
    // 半天汇总法：全天出勤率=(上午出勤次数+下午出勤次数)/(上午记录数+下午记录数)；无上下午记录时回退全天考勤
    var _stuRateAll;
    if(_stuAttAm.length||_stuAttPm.length){
      var _stuAmP=_stuAttAm.filter(function(a){return a.status==="present";}).length;
      var _stuPmP=_stuAttPm.filter(function(a){return a.status==="present";}).length;
      var _stuTotal=_stuAttAm.length+_stuAttPm.length;
      _stuRateAll=_stuTotal?(_stuAmP+_stuPmP)/_stuTotal:st.attendance;
    }else{
      _stuRateAll=_stuAttAll.length?(_stuAttAll.filter(function(a){return a.status==="present";}).length/_stuAttAll.length):st.attendance;
    }
    var _stuAttTxt="全天"+fmtPct(_stuRateAll)+(_stuRateAm!==null?" · 上午"+fmtPct(_stuRateAm):"")+(_stuRatePm!==null?" · 下午"+fmtPct(_stuRatePm):"");
    var pts=DB.points.filter(function(p){return p.studentId===id;}).slice(-5).reverse().map(function(p){return '<div class="rec-row">'+(p.type==="add"?"+":"")+p.score+' '+esc(p.reason)+' <span class="muted">'+p.date+'</span></div>';}).join("")||'<div class="muted">暂无</div>';

    var disc=DB.discipline.filter(function(d){return d.studentId===id;}).slice(-5).reverse().map(function(d){return '<div class="rec-row">['+d.date+'] '+esc(d.type)+'：'+esc(d.description)+'</div>';}).join("")||'<div class="muted">暂无</div>';
    var sc=classExams().map(function(e){var r=DB.scores.find(function(x){return x.examId===e.id&&x.studentId===id;});return r&&e.total?Math.round(r.total/e.total*100):0;});
    var line=lineChart(sc,classExams().map(function(e){return e.name.slice(0,4);}));
    var html='<div class="dh"><h3>学生档案</h3><button class="icon-btn" onclick="App.closeDrawer()">✕</button></div>'
      +'<div class="hero"><div class="ava" style="background:'+avatarColor(st.name)+'">'+st.name.charAt(0)+'</div><div><div class="nm">'+esc(st.name)+'</div><div class="cl">'+clsName(st.id.split("-")[0])+' · '+st.no+' · '+st.gender+' · '+(st.boarding?'住校':'走读')+'</div></div></div>'
      +'<div class="kv"><span class="k">标签</span><span class="v" style="text-align:right">'+tags+'</span></div>'
      +'<div class="kv"><span class="k">综合成绩 / 排名</span><span class="v">'+st.score+' 分'+(st.scoreFull?' <span class="muted" style="font-size:11px">/ 满分 '+st.scoreFull+'</span>':"")+' · 第 '+st.rank+' 名 <span class="muted" style="font-size:11px">'+(st.scoreManual?'（手动指定）':'（最近考试总分）')+'</span></span></div>'
      +'<div class="kv"><span class="k">考勤率</span><span class="v"><span class="mini-bar" style="width:120px"><i style="width:'+(_stuRateAll*100)+'%;background:'+attc+'"></i></span> '+_stuAttTxt+'</span></div>'
      +'<div class="kv"><span class="k">行为分 / 量化积分</span><span class="v">'+st.behavior+' / '+st.points+'</span></div>'
      +'<div class="kv"><span class="k">预警状态</span><span class="v">'+w+'</span></div>'
      +'<div class="kv"><span class="k">联系电话</span><span class="v"><span id="ph_'+st.id+'">'+desensPhone(st.phone)+'</span> <a class="link" data-on="0" title="点击显示/隐藏完整号码" onclick="App.togglePhone(\''+st.id+'\',this)">👁</a> <a class="link" onclick="App.copyPhone(\''+st.phone+'\')">复制</a></span></div>'
      +'<div class="kv"><span class="k">父亲</span><span class="v">'+esc(st.father||"—")+' <span id="phf_'+st.id+'">'+(st.fatherPhone?desensPhone(st.fatherPhone):"")+'</span>'+(st.fatherPhone?' <a class="link" data-on="0" title="点击显示/隐藏完整号码" onclick="App.togglePhone(\''+st.id+'\',this,\'f\')">👁</a> <a class="link" onclick="App.copyPhone(\''+st.fatherPhone+'\')">复制</a>':"")+'</span></div>'
      +'<div class="kv"><span class="k">母亲</span><span class="v">'+esc(st.mother||"—")+' <span id="phm_'+st.id+'">'+(st.motherPhone?desensPhone(st.motherPhone):"")+'</span>'+(st.motherPhone?' <a class="link" data-on="0" title="点击显示/隐藏完整号码" onclick="App.togglePhone(\''+st.id+'\',this,\'m\')">👁</a> <a class="link" onclick="App.copyPhone(\''+st.motherPhone+'\')">复制</a>':"")+'</span></div>'
      +(st.idCard?'<div class="kv"><span class="k">身份证号</span><span class="v">'+esc(st.idCard)+'</span></div>':"")
      +(st.address?'<div class="kv"><span class="k">家庭住址</span><span class="v">'+esc(st.address)+'</span></div>':"")
      +'<div class="sub-sec"><h4>成绩趋势</h4>'+line+'</div>'
      +'<div class="grid-2"><div class="sub-sec"><h4>最近积分</h4>'+pts+'</div><div class="sub-sec"><h4>违纪记录</h4>'+disc+'</div></div>'

      +'<div style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn btn-primary" style="flex:1" onclick="App.pickStudent(\''+id+'\');App.setView(\'evaluate\');App.setMtab(\'档案\')">成长档案</button><button class="btn btn-soft" style="flex:1" onclick="App.exportStudentReportDoc(\''+id+'\')">'+ICONS.download+' 报告</button><button class="btn btn-soft" style="flex:1" onclick="App.addTalk(\''+id+'\')">记录谈话</button><button class="btn btn-danger" style="flex:1" onclick="App.deleteStudent(\''+id+'\')">删除</button></div>';
    document.getElementById("drawer").innerHTML=html;
    document.getElementById("overlay").classList.add("open");
  }

  function saveStudent(id){
    var name=document.getElementById("f_name").value.trim();if(!name){toast("请输入姓名");return;}
    var cid=filterClass==="all"?"c1":filterClass;
    var fs=document.getElementById("f_score");
    var prev=id?studentById(id):null;
    var score=fs&&fs.value!==""?Math.max(0,Math.min(2000,parseFloat(fs.value)||0)):(prev?prev.score:rint(60,100));
    var manual=fs&&fs.value!=="";
    var scoreFull=manual?(prev&&prev.scoreFull?prev.scoreFull:(prev&&prev.score!==undefined?prev.score:100)):(prev?prev.scoreFull:null);
    var fb=document.getElementById("f_beh");
    var behavior=fb?Math.max(0,Math.min(100,parseInt(fb.value,10)||70)):(prev?prev.behavior:rint(70,100));
    var data={name:name,no:document.getElementById("f_no").value.trim()||(cid==="c1"?"202302":"202305")+String(DB.students.filter(function(s){return s.id.indexOf(cid+"-")===0;}).length+1).padStart(2,"0"),gender:document.getElementById("f_gender").value,phone:document.getElementById("f_phone").value.trim(),boarding:document.getElementById("f_board").value==="住校",duty:document.getElementById("f_duty").value,tags:document.getElementById("f_tags").value.split(/[，,]/).map(function(t){return t.trim();}).filter(Boolean),familyStatus:document.getElementById("f_fam").value.trim(),parent:document.getElementById("f_father").value.trim(),guardian:document.getElementById("f_mother").value.trim(),father:document.getElementById("f_father").value.trim(),fatherPhone:document.getElementById("f_fatherPhone").value.trim(),mother:document.getElementById("f_mother").value.trim(),motherPhone:document.getElementById("f_motherPhone").value.trim(),idCard:document.getElementById("f_idcard").value.trim(),address:document.getElementById("f_addr").value.trim(),attendance:1,late:0,absent:0,score:score,behavior:behavior,rank:0,warnings:[],points:0,join:todayStr(),id:id||(cid+"-"+Date.now()),groupNo:parseInt((document.getElementById("f_group")||{}).value,10)||0,scoreManual:manual,scoreFull:scoreFull};
    if(id){var i=DB.students.findIndex(function(s){return s.id===id;});DB.students[i]=Object.assign(DB.students[i],data);}else{DB.students.push(data);}
    computeRank(DB.students);save();closeModal();render();toast(id?"已更新":"已新增 "+name);
  }
  function deleteStudent(id){var st=studentById(id);if(!st)return;
    confirm2("确定删除学生「"+st.name+"」吗？其成绩/考勤/积分/违纪/谈话/家校/荣誉/请假等关联数据将一并删除，此操作不可撤销。",function(){
    DB.students=DB.students.filter(function(s){return s.id!==id;});
    // v2.0.3：删除学生时清理全部关联数据，避免孤立记录污染统计
    ["scores","attendance","leaves","points","discipline","talks","communications","honors","evaluations","specialAid","weekendOut","classPerformances"].forEach(function(k){if(Array.isArray(DB[k]))DB[k]=DB[k].filter(function(r){return r.studentId!==id;});});
    if(DB.quality)delete DB.quality[id];
    if(DB.subjectSelection)delete DB.subjectSelection[id];
    DB.homework.forEach(function(h){h.submitted=h.submitted.filter(function(x){return x!==id;});h.late=h.late.filter(function(x){return x!==id;});h.missing=h.missing.filter(function(x){return x!==id;});});

  function detectSubjectCols(head){
    var map={};
    // 识别键集合 = 内置 9 科别名表 + 科目管理里用户自定义且已启用的科目（v1.4.1 修复：自定义科目可被识别）
    var aliases={};
    var usedNames={};
    for(var sub in SUBJECT_ALIAS){
      aliases[sub]=SUBJECT_ALIAS[sub].slice();
      SUBJECT_ALIAS[sub].forEach(function(a){usedNames[a]=1;});
    }
    (DB.setting.subjectList||[]).forEach(function(sj){
      if(sj.enabled===false)return;
      var n=sj.name;
      if(!n||!n.trim())return;
      n=n.trim();
      // 自定义科目名与内置科目同名（如自定义也叫「政治」）→ 走内置规则避免重复映射
      if(SUBJECT_ALIAS[n]&&SUBJECT_ALIAS[n].indexOf(n)>=0)return;
      // v2.0.4 修复：自定义科目名是内置科目的「别名」时（如「道德与法治」是「政治」的别名），
      // 以自定义科目为准——从内置别名中移除该名称并建立独立科目，成绩归入自定义科目而非被映射成内置科
      for(var kk in SUBJECT_ALIAS){
        if(SUBJECT_ALIAS[kk].indexOf(n)>=0){
          aliases[kk]=aliases[kk].filter(function(a){return a!==n;});
          if(!aliases[kk].length)delete aliases[kk];
        }
      }
      aliases[n]=[n];
      usedNames[n]=1;
    });
    for(var i=0;i<head.length;i++){
      var h=normCol(head[i]);
      if(!h)continue;
      for(var sub in aliases){
        if(map[sub]!==undefined)continue;
        for(var a=0;a<aliases[sub].length;a++){
          var alias=normCol(aliases[sub][a]);
          if(h===alias||h.indexOf(alias)>=0&&alias.length>=2){map[sub]=i;break;}
        }
      }
    }

  }

  // v2.0.4 成绩上传：解析 Word(.docx) 内第一个表格 → 二维数组（与 Excel/CSV 相同结构）
  function docxTableToRows(xmlText){
    var doc=new DOMParser().parseFromString(xmlText,"text/xml");
    var tbl=doc.getElementsByTagName("w:tbl")[0];
    if(!tbl)return null;
    var rows=[];
    var trs=tbl.getElementsByTagName("w:tr");
    for(var i=0;i<trs.length;i++){
      var row=[];
      var tcs=trs[i].getElementsByTagName("w:tc");
      for(var j=0;j<tcs.length;j++){
        var ts=tcs[j].getElementsByTagName("w:t");
        var txt="";
        for(var k=0;k<ts.length;k++)txt+=ts[k].textContent;
        row.push(txt.trim());
      }
      rows.push(row);
    }
    return rows;
  }

    var clsStudents=DB.students.filter(function(s){return s.id.indexOf(cls+"-")===0;});
    clsStudents.forEach(function(s){
      if(s.name)existing["n:"+s.name]=(existing["n:"+s.name]||[]).concat([s]);
      if(s.no)existing["no:"+String(s.no)]=(existing["no:"+String(s.no)]||[]).concat([s]);
    });
    rows.forEach(function(r,idx){
      var nameCol=map.name!==undefined?map.name:0;
      var name=String(r[nameCol]==null?"":r[nameCol]).trim();
      if(!name){skipped++;return;}
      if(seen[name]){skipped++;return;}seen[name]=1;
      var target=cls;
      if(map.cls!==undefined&&String(r[map.cls]==null?"":r[map.cls]).trim()){
        var cn=String(r[map.cls]).trim();
        var cf=DB.classes.find(function(c){return c.name===cn||cn.indexOf(c.name)>=0||c.name.indexOf(cn)>=0;});
        if(cf)target=cf.id;
      }
      // 学号（用于匹配去重）
      var no=map.no!==undefined?String(r[map.no]==null?"":r[map.no]).trim():"";
      // 去重匹配：目标班级内已有「同名」或「同学号」的学生则复用，不重复创建
      var targetExisting=DB.students.filter(function(s){return s.id.indexOf(target+"-")===0;});
      var match=null;
      if(no&&targetExisting.some(function(s){return s.no&&String(s.no)===no;})){
        match=targetExisting.find(function(s){return s.no&&String(s.no)===no;});
      }else if(name&&targetExisting.some(function(s){return s.name===name;})){
        match=targetExisting.find(function(s){return s.name===name;});
      }
      var gender=map.gender!==undefined?String(r[map.gender]==null?"":r[map.gender]).trim():"";
      if(/^(m|male|男|1)$/i.test(gender))gender="男";
      else if(/^(f|female|女|0|2)$/i.test(gender))gender="女";
      else gender="";
      var phone=map.phone!==undefined?String(r[map.phone]==null?"":r[map.phone]).trim():"";
      var fatherName=map.fatherName!==undefined?String(r[map.fatherName]==null?"":r[map.fatherName]).trim():"";
      var fatherPhone=map.fatherPhone!==undefined?String(r[map.fatherPhone]==null?"":r[map.fatherPhone]).trim():"";
      var motherName=map.motherName!==undefined?String(r[map.motherName]==null?"":r[map.motherName]).trim():"";
      var motherPhone=map.motherPhone!==undefined?String(r[map.motherPhone]==null?"":r[map.motherPhone]).trim():"";
      var parent=map.parent!==undefined?String(r[map.parent]==null?"":r[map.parent]).trim():"";
      var note=map.note!==undefined?String(r[map.note]==null?"":r[map.note]).trim():"";
      var idcard=map.idcard!==undefined?String(r[map.idcard]==null?"":r[map.idcard]).trim():"";
      var address=map.address!==undefined?String(r[map.address]==null?"":r[map.address]).trim():"";
      // v2.0.4 修复：住校/走读列识别——值含「住校/住宿/是/1/true」判为住校，其余（含走读/空）为走读
      var boardingRaw=map.boarding!==undefined?String(r[map.boarding]==null?"":r[map.boarding]).trim():"";
      var isBoarding=/住校|住读|住宿|是|true|^1$/i.test(boardingRaw);
      var stuId;
      if(match){
        // 复用已有学生：只更新缺失的电话/家长/身份证/住址信息，不重复创建
        stuId=match.id;
        if(phone&&!match.phone)match.phone=phone;
        if(fatherName&&!match.father)match.father=fatherName;
        if(fatherPhone&&!match.fatherPhone)match.fatherPhone=fatherPhone;
        if(motherName&&!match.mother)match.mother=motherName;
        if(motherPhone&&!match.motherPhone)match.motherPhone=motherPhone;
        if(parent&&!match.father)match.father=parent;
        if(parent&&!match.parent)match.parent=parent;
        if(idcard&&!match.idCard)match.idCard=idcard;
        if(address&&!match.address)match.address=address;
        if(map.boarding!==undefined)match.boarding=isBoarding;
        merged++;
      }else{
        var cnt=targetExisting.length;
        if(!no)no=String(cnt+1).padStart(2,"0");
        stuId=target+"-"+Date.now()+idx;
        DB.students.push({id:stuId,name:name,no:no,gender:gender,phone:phone,parent:parent||fatherName||motherName,guardian:"",father:fatherName||parent,fatherPhone:fatherPhone,mother:motherName,motherPhone:motherPhone,familyStatus:"",boarding:isBoarding,duty:"",tags:note?[note]:[],attendance:1,late:0,absent:0,score:null,behavior:80,rank:0,warnings:[],points:0,join:todayStr(),groupNo:1,idCard:idcard,address:address});
        added++;
      }
      // 记录该生成绩（v1.2.0：同一张表导入各科成绩；v1.4.1：绑定到复用或新建的学生 ID）
      var subjMap=mstate.importSubj||{};
      var subKeys=Object.keys(subjMap);
      if(subKeys.length){
        var subs=[];var any=false;
        subKeys.forEach(function(k){
          var v=String(r[subjMap[k]]==null?"":r[subjMap[k]]).trim();
          var n=parseFloat(v);
          if(v!==""&&!isNaN(n)){subs.push({name:k,score:n});any=true;}
        });
        if(any){if(!mstate.impScoreRows)mstate.impScoreRows=[];mstate.impScoreRows.push({studentId:stuId,subjects:subs});}
      }
    });
    if(!added&&!merged){toast("没有导入任何学生（请检查姓名列）");return;}
    computeRank(DB.students);
    // 若有成绩：自动创建考试并录入（v1.2.0）
    var scoreRows=mstate.impScoreRows||[];
    var examCreated=null;
    if(scoreRows.length){
      var eid="e"+Date.now();
      var subjMap=mstate.importSubj||{};
      var examSubs=Object.keys(subjMap).map(function(k){var f=DB.setting.subjectList?DB.setting.subjectList.find(function(x){return x.name===k;}):null;return {name:k,full:f&&f.full?f.full:100};});
      // v1.4.1：考试名称支持自定义（预览时输入，避免多次导入出现同名考试）
      var examNameInput=document.getElementById("imp_exam_name");
      var examName=examNameInput&&examNameInput.value.trim()?examNameInput.value.trim():(DB.classes.find(function(c){return c.id===cls;})||{}).name+"成绩导入";
      DB.exams.push({id:eid,name:examName,date:todayStr(),subjects:examSubs,total:examSubs.reduce(function(a,b){return a+(b.full||100);},0),classId:cls});
      // v1.4.1：同一学生+同一科目在本次导入内去重（后值覆盖前值），防止重复行产生重复成绩
      var seenSub={};
      var deduped=[];
      scoreRows.forEach(function(x){
        var uniq={};
        x.subjects.forEach(function(sb){uniq[sb.name]=sb.score;});
        var subs=Object.keys(uniq).map(function(k){return {name:k,score:uniq[k]};});
        deduped.push({studentId:x.studentId,subjects:subs});
      });
      var scoreList=deduped.map(function(x){var total=roundScore(x.subjects.reduce(function(a,b){return a+b.score;},0));return {id:uid(),examId:eid,studentId:x.studentId,subjects:x.subjects,total:total,rank:0};});
      DB.scores=DB.scores.concat(scoreList);
      var all=DB.scores.filter(function(x){return x.examId===eid;}).sort(function(a,b){return b.total-a.total;});
      all.forEach(function(r,i){r.rank=i+1;});
      syncScoreFromExams(scoreList.map(function(x){return x.studentId;}));
      examCreated=eid;
    }
    _impDefaultCls=null;
    save();closeModal();render();
    toast("已导入 "+added+" 名学生"+(merged?"，合并更新 "+merged+" 名已有学生（不重复创建）":"")+(skipped?"，跳过 "+skipped+" 行（空姓名/重复）":"")+(examCreated?"，并自动创建考试「"+examName+"」录入成绩":""));
  }

  function fullSelChange(v){var el=document.getElementById("e_full_custom");if(el)el.style.display=v==="custom"?"block":"none";}
  // mode: "subject"=按科目默认满分；数字=统一满分档位
  function parseExamSubjects(str,defFull,mode){
    return str.split(/[，,]/).map(function(s){return s.trim();}).filter(Boolean).map(function(s){
      var m=s.match(/^(.+?)[（(]?\s*(\d{1,4})\s*[)）]?分?$/);
      if(m)return {name:m[1].trim(),full:parseInt(m[2],10)};
      if(mode==="subject")return {name:s,full:subjectFullOf(s)};
      return {name:s,full:defFull||100};
    });
  }
  function saveExam(){
    var name=document.getElementById("e_name").value.trim();if(!name){toast("请输入名称");return;}
    var sel=document.getElementById("e_full_sel").value;
    var defFull=sel==="custom"?(parseInt(document.getElementById("e_full_num").value,10)||100):(sel==="subject"?0:parseInt(sel,10));
    var subs=parseExamSubjects(document.getElementById("e_subs").value,defFull,sel==="subject"?"subject":"");
    if(!subs.length){toast("请至少填写一个科目");return;}
    var total=subs.reduce(function(a,s){return a+s.full;},0);
    var e={id:uid(),name:name,date:document.getElementById("e_date").value,subjects:subs,total:total,fullScale:defFull};
    e.classId=filterClass;DB.exams.push(e);save();closeModal();render();toast("已创建考试，满分 "+total+" 分");
  }
  function deleteExam(id){confirm2("确定删除该考试及其成绩？",function(){DB.exams=DB.exams.filter(function(e){return e.id!==id;});DB.scores=DB.scores.filter(function(s){return s.examId!==id;});save();render();toast("已删除");});}
  // 综合成绩 = 最近一次该生有成绩的考试总分（所有科目之和）；scoreFull 记录该考试满分；手动指定过综合成绩的学生（scoreManual）不自动覆盖
  function syncScoreFromExams(sids){
    var sorted=DB.exams.slice().sort(function(a,b){var da=a.date||"9999-12-31",db=b.date||"9999-12-31";return da<db?-1:(da>db?1:0);});
    (sids||DB.students.map(function(s){return s.id;})).forEach(function(sid){
      var st=studentById(sid);if(!st||st.scoreManual)return;
      var latest=null;
      sorted.forEach(function(e){
        if(!e.total)return;
        var r=DB.scores.find(function(x){return x.examId===e.id&&x.studentId===sid;});
        if(r&&r.total>0)latest={total:r.total,full:e.total};
      });
      if(latest){st.score=roundScore(latest.total);st.scoreFull=latest.full;}
    });
    computeRank(DB.students);
  }
  function scoreRate(st){return st&&st.scoreFull?(Math.round(st.score/st.scoreFull*1000)/10):(st&&st.score!=null?st.score:0);}
  /* ============ 增值性评价（v1.4.1：基线=第一次考试自动生成，差值分档） ============ */
  function vaPct(){return (DB.setting.vaStd&&DB.setting.vaStd.pct)||5;}
  // 取某生某科在某次考试中的成绩，无则返回 null
  function subScoreOf(score,subName){var f=score&&score.subjects?score.subjects.find(function(x){return x.name===subName;}):null;return f?(f.score!=null?f.score:null):null;}
  // 某生全部有成绩的考试（按日期升序），返回 [{exam,score,total,rate}]
  function vaExamsOf(sid){
    var exs=DB.exams.slice().sort(function(a,b){var da=a.date||"9999-12-31",db=b.date||"9999-12-31";return da<db?-1:(da>db?1:0);});
    var rows=[];
    exs.forEach(function(e){var r=DB.scores.find(function(x){return x.examId===e.id&&x.studentId===sid;});if(r&&r.total!=null)rows.push({exam:e,score:r,total:r.total});});
    return rows;
  }
  // 基线：第一次考试的总分与各科成绩；未生成则自动生成
  function vaBaseOf(sid,force){
    var s=studentById(sid);if(!s)return null;
    if(!force&&s.vaBase!==undefined&&s.vaBase!==null)return s.vaBase;
    var rows=vaExamsOf(sid);
    if(!rows.length){s.vaBase=null;return null;}
    var first=rows[0];
    var subs={};
    (first.exam.subjects||[]).forEach(function(sb){var v=subScoreOf(first.score,sb.name);if(v!=null)subs[sb.name]=v;});
    s.vaBase={examId:first.exam.id,examName:first.exam.name,date:first.exam.date,total:first.total,subs:subs};
    return s.vaBase;
  }
  // 增值分：base 为基线值，cur 为本次值，pct 为档位阈值(%)；高 pct% 内=+1、超=+2；低 pct% 内=-1、超=-2
  function vaScoreOf(base,cur){
    if(base==null||cur==null||!base)return null;
    var p=vaPct();
    var d=(cur-base)/base*100;
    if(d>p)return 2;
    if(d>0)return 1;
    if(d===-0)return 0;
    if(d< -p)return -2;
    if(d<0)return -1;
    return 0;
  }
  // 单科增值分（按基线各科）
  function vaSubScore(sid,subName){
    var b=vaBaseOf(sid);if(!b)return null;
    var cur=null;
    var rows=vaExamsOf(sid);
    var last=rows[rows.length-1];
    if(last)cur=subScoreOf(last.score,subName);
    return vaScoreOf(b.subs[subName],cur);
  }
  // 阶段评价结果（最近一次考试）：返回 {examName,total,va,subs:[{name,base,cur,va}],overall,avg}
  function vaStage(sid){
    var b=vaBaseOf(sid);if(!b)return null;
    var rows=vaExamsOf(sid);
    if(!rows.length)return null;
    var last=rows[rows.length-1];
    var subs=[];
    (last.exam.subjects||[]).forEach(function(sb){
      var base=b.subs[sb.name];
      var cur=subScoreOf(last.score,sb.name);
      if(base!=null||cur!=null)subs.push({name:sb.name,base:base,cur:cur,va:vaScoreOf(base,cur)});
    });
    var va=vaScoreOf(b.total,last.total);
    var vals=subs.map(function(x){return x.va;}).filter(function(v){return v!==null;});
    var avg=vals.length?(vals.reduce(function(a,c){return a+c;},0)/vals.length):va;
    var overall=avg>=1.5?"进步显著":(avg>=0.5?"稳步提升":(avg>=-0.5?"保持稳定":"需加油"));
    return {base:b,examName:last.exam.name,date:last.exam.date,total:last.total,va:va,subs:subs,avg:Math.round(avg*10)/10,overall:overall};
  }
  function vaBadge(v){
    if(v===null||v===undefined)return '<span class="tag gray">—</span>';
    var t=v>0?"+"+v:String(v);
    var c=v>1?"green":(v>0?"teal":(v===0?"gray":(v>-2?"amber":"red")));
    return '<span class="tag '+c+'">'+t+'</span>';
  }

  function saveScores(eid){var e=DB.exams.find(function(x){return x.id===eid;});var list=DB.students.filter(function(s){return filterClass==="all"||s.id.indexOf(filterClass+"-")===0;});var errs=[];list.forEach(function(s){e.subjects.forEach(function(sub){var el=document.getElementById("sc_"+s.id+"_"+sub.name);if(!el)return;var v=parseInt(el.value,10);if(!isNaN(v)&&v>(sub.full||100)){errs.push({stu:s.name,sub:sub.name,v:v,full:sub.full||100,el:el});}});});if(errs.length){errs.slice(0,3).forEach(function(x){if(x.el)x.el.style.borderColor="#EF4444";});toast("「"+errs[0].stu+"」"+errs[0].sub+" 成绩 "+errs[0].v+" 超过满分 "+errs[0].full+"，已取消保存，请修正"+(errs.length>1?"（共 "+errs.length+" 处）":""));return;}var rows=[];var emptyHint=0;list.forEach(function(s){var subs=[];e.subjects.forEach(function(sub){var el=document.getElementById("sc_"+s.id+"_"+sub.name);if(!el)return;var v=parseInt(el.value,10);if(isNaN(v)||el.value.trim()===""){emptyHint++;return;}subs.push({name:sub.name,score:v});});if(!subs.length)return;var total=roundScore(subs.reduce(function(a,b){return a+b.score;},0));rows.push({id:uid(),examId:eid,studentId:s.id,subjects:subs,total:total,rank:0});});DB.scores=DB.scores.filter(function(x){return !(x.examId===eid&&list.some(function(s){return s.id===x.studentId;}));}).concat(rows);var all=DB.scores.filter(function(x){return x.examId===eid;}).sort(function(a,b){return b.total-a.total;});all.forEach(function(r,i){r.rank=i+1;});syncScoreFromExams(list.map(function(s){return s.id;}));save();closeModal();render();toast("已保存 "+rows.length+" 条成绩"+(emptyHint?"（"+emptyHint+" 科留空未录入，已跳过）":"")+"，综合成绩已按最近一次考试自动更新");}

  /* ============ 考勤 ============ */
  function attMap(date,period){period=period||"all";var recs=DB.attendance.filter(function(a){return a.date===date&&!a.night&&(a.period||"all")===period;});var m={};recs.forEach(function(a){m[a.studentId]=a.status;});return m;}
  function setAtt(sid,date,status,period){
    period=period||"all";
    var rec=DB.attendance.find(function(a){return a.date===date&&(a.period||"all")===period&&!a.night&&a.studentId===sid;});
    if(rec){rec.status=status;}else{DB.attendance.push({id:uid(),date:date,studentId:sid,status:status,night:false,period:period});}
    // v2.0.3.4 反向联动：考勤点「请假」→ 自动同步到请假管理生成临时请假（记录时段：全天/上午/下午/大课间/一托/二托）；
    // 点回其他状态 → 删除该生当天的临时请假（只删考勤自动生成的，不误删手动提交的请假单）。
    if(status==="leave"){
      var dup=DB.leaves.find(function(l){return l.studentId===sid&&l.startDate<=date&&l.endDate>=date;});
      if(!dup){
        var st0=studentById(sid);
        DB.leaves.push({id:uid(),studentId:sid,type:"事假",reason:"考勤点选·临时请假",startDate:date,endDate:date,status:"已批准",duration:1,outing:st0&&st0.boarding,leavePeriod:period,temp:true});
      }
    }else{
      DB.leaves=DB.leaves.filter(function(l){return !(l.temp&&l.studentId===sid&&l.startDate<=date&&l.endDate>=date);});
    }
    save();render();
  }
  function setAttPeriod(p){mstate.attPeriod=p;render();}
  function setMeal(sid,date,meal,value,period){period=period||"all";var rec=DB.attendance.find(function(a){return a.date===date&&(a.period||"all")===period&&a.studentId===sid;});if(rec){rec[meal]=value;}else{var nr={id:uid(),date:date,studentId:sid,status:"present",night:false,period:period};nr[meal]=value;DB.attendance.push(nr);}save();render();}
  function allPresent(date,period){period=period||"all";var list=DB.students.filter(function(s){return filterClass==="all"||s.id.indexOf(filterClass+"-")===0;});var m={};list.forEach(function(s){m[s.id]="present";});persistAtt(date,m,false,period);save();render();toast("已标记全部出勤并保存");}
  function persistAtt(date,m,night,period){period=period||"all";DB.attendance=DB.attendance.filter(function(a){return !(a.date===date&&!!a.night===night&&(a.period||"all")===period);});Object.keys(m).forEach(function(sid){var rec={id:uid(),date:date,studentId:sid,status:m[sid],night:night,period:period};if(m[sid+"_breakfast"]!==undefined)rec.breakfast=m[sid+"_breakfast"];if(m[sid+"_lunch"]!==undefined)rec.lunch=m[sid+"_lunch"];if(m[sid+"_boarding"]!==undefined)rec.boarding=m[sid+"_boarding"];DB.attendance.push(rec);});}
  // v2.0.3 修复：保存点名 = 该时段全员状态一次性落库（含未点名的默认出勤），避免逐条零散记录
  function saveAtt(date,period){
    period=period||"all";
    var list=DB.students.filter(function(s){return filterClass==="all"||s.id.indexOf(filterClass+"-")===0;});
    var m={};
    // 已点名的以记录为准
    var existing=DB.attendance.filter(function(a){return a.date===date&&(a.period||"all")===period&&!a.night;});
    existing.forEach(function(a){m[a.studentId]=a.status;});
    // 未点名的默认出勤
    list.forEach(function(s){if(m[s.id]===undefined)m[s.id]="present";});
    persistAtt(date,m,false,period);save();toast("已保存点名（"+Object.keys(m).length+" 人）");
  }

      }

  function deleteGroup(i){

  function exportAttendanceCSV(scope){
    scope=scope||"week";
    var list=DB.students.filter(function(s){return filterClass==="all"||s.id.indexOf(filterClass+"-")===0;});
    var days=[];var t=new Date();
    if(scope==="week"){
      var dow=t.getDay()||7; // 周日=7
      var monday=new Date(t.getFullYear(),t.getMonth(),t.getDate()-dow+1);
      for(var i=0;i<dow;i++)days.push(localDateStr(new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i)));
    }else{
      for(var i=0;i<t.getDate();i++)days.push(localDateStr(new Date(t.getFullYear(),t.getMonth(),i+1)));
    }
    var stateLabel={present:"出勤",late:"迟到",leave:"请假",absent:"缺勤"};
    var header=["姓名","学号"].concat(days).concat(["迟到次数","请假天数","缺勤天数"]);
    var rows=[header];
    list.forEach(function(s){
      var row=[s.name,s.no||""];var late=0,leave=0,absent=0;
      days.forEach(function(ds){
        var st=dayAttStatus(s.id,ds);
        if(st==="late")late++;else if(st==="leave")leave++;else if(st==="absent")absent++;
        row.push(st?stateLabel[st]:"");
      });
      row.push(late,leave,absent);
      rows.push(row);
    });
    exportCSV((scope==="week"?"本周考勤记录":"本月考勤记录")+"-"+clsName(filterClass)+"-"+todayStr()+".csv",rows);
    toast("已导出"+(scope==="week"?"本周":"本月")+"考勤记录（"+days.length+" 天）");
  }
  // 学生某天考勤最终状态（与仪表盘口径一致）：已批准请假优先；否则取当天考勤记录异常优先；无记录返回空
  function dayAttStatus(sid,ds){
    var lv=DB.leaves.filter(function(l){return l.status==="已批准"&&(l.leavePeriod||"all")!=="recess"&&l.studentId===sid&&l.startDate<=ds&&l.endDate>=ds;})[0];
    if(lv)return "leave";
    var rank={absent:3,leave:2,late:1,present:0};
    var best=null;
    DB.attendance.filter(function(a){return a.date===ds&&!a.night&&(a.period||"all")!=="recess"&&a.studentId===sid;}).forEach(function(a){
      var st=a.status||"present";
      if(!best||(rank[st]||0)>(rank[best]||0))best=st;
    });
    return best;
  }

  function autoSeat(mode){
    mode=mode||"default";
    var list=DB.students.filter(function(s){return filterClass==="all"||s.id.indexOf(filterClass+"-")===0;}).slice();
    if(mode==="score")list.sort(function(a,b){return (b.score||0)-(a.score||0);});
    else if(mode==="composite")list.sort(function(a,b){return ((b.score||0)+(b.behavior||0)*2)-( (a.score||0)+(a.behavior||0)*2 );});
    else list.sort(function(a,b){return (a.no||"").localeCompare(b.no||"");});
    var idx=0;
    for(var r=0;r<DB.seatSetting.rows;r++)for(var c=0;c<DB.seatSetting.cols;c++){DB.seatSetting.layout[r][c]=list[idx]?list[idx].id:null;idx++;}
    save();render();toast("已按"+(mode==="score"?"成绩从高到低":(mode==="composite"?"综合表现(成绩+行为分)":"名单学号"))+"自动排位");
  }

  // 座位表导出图片
  function exportSeatPNG(){
    var seat=DB.seatSetting;
    var desk=seat.desk||1;
    var cellW=92,cellH=54,pad=18,gap=14,aisleW=22;
    var cols=seat.cols,rows=seat.rows;
    var gCols=Math.max(1,Math.ceil(cols/desk)); // 桌组数：双人桌=2列合并1桌
    var aisles=seat.aisleCount||0;
    var groups=Math.max(1,aisles+1);
    var per=Math.max(1,Math.ceil(gCols/groups));
    var deskW=desk*cellW;
    var aisleN=Math.max(0,Math.ceil(gCols/per)-1);
    var w=pad*2+gCols*deskW+Math.max(0,gCols-1)*gap+aisleN*aisleW;
    var h=rows*cellH+pad*2+58;
    var cv=document.createElement("canvas");
    cv.width=w;cv.height=h;
    var g=cv.getContext("2d");
    g.fillStyle="#F4F7FB";g.fillRect(0,0,w,h);
    // 讲台
    g.fillStyle="#2B7FFF";
    g.fillRect(w/2-70,pad-8,140,26);
    g.fillStyle="#fff";g.font="13px sans-serif";g.textAlign="center";
    g.fillText("讲 台",w/2,pad+11);
    g.font="13px 'Microsoft YaHei',sans-serif";
    var modeName=desk===3?"三人座":(desk===2?"双人座":"单人座");
    for(var r=0;r<rows;r++){
      var row=seat.layout[r]||[];
      for(var gc=0;gc<gCols;gc++){
        var gx=pad+gc*(deskW+gap)+(gc>0&&gc%per===0?aisleW:0);
        var gy=pad+50+r*cellH;
        // 桌外框（蓝色粗框 + 浅蓝底）：一眼区分一人/双人/三人桌
        g.fillStyle="#E8F1FF";
        g.fillRect(gx-4,gy-4,deskW+8,cellH+8);
        g.strokeStyle="#2B7FFF";g.lineWidth=2;
        g.strokeRect(gx-4,gy-4,deskW+8,cellH+8);
        // 桌内座位格
        for(var dc=0;dc<desk;dc++){
          var ci=gc*desk+dc;
          if(ci>=cols)break;
          var id=row[ci];
          var st=id?studentById(id):null;
          var x=gx+dc*cellW,y=gy;
          g.fillStyle=st?"#FFFFFF":"#F0F3F7";
          g.fillRect(x,y,cellW-8,cellH-10);
          g.strokeStyle=st?"#CBD5E1":"#DDE3EC";g.lineWidth=1;
          g.strokeRect(x,y,cellW-8,cellH-10);
          if(st){
            g.fillStyle="#1A2333";g.textAlign="center";
            g.fillText(st.name,x+(cellW-8)/2,y+cellH/2-2);
            g.fillStyle="#8A94A6";g.font="11px sans-serif";
            g.fillText((st.gender==="男"?"男":"女")+(st.boarding?" 住":""),x+(cellW-8)/2,y+cellH/2+14);
            g.font="13px 'Microsoft YaHei',sans-serif";
          }
        }
      }
    }
    g.fillStyle="#8A94A6";g.font="11px sans-serif";g.textAlign="center";
    g.fillText(clsName(filterClass)+" 座位表（"+modeName+"）· "+todayStr()+" · 共 "+gCols+" 桌",w/2,h-8);
    try{
      var a=document.createElement("a");
      a.href=cv.toDataURL("image/png");
      a.download="座位表-"+clsName(filterClass)+"-"+modeName+".png";
      a.click();
      toast("已导出座位表图片（"+modeName+"）");
    }catch(e){toast("导出失败："+e.message);}
  }

  function compressImage(file,cb){
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1000,w=img.width,h=img.height;
        if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
        var c=document.createElement("canvas");c.width=w;c.height=h;
        var cx=c.getContext("2d");cx.drawImage(img,0,0,w,h);
        cb(c.toDataURL("image/jpeg",0.6));
      };
      img.onerror=function(){toast("图片读取失败，请换一张");};
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }
