<style>
  :root{
    --primary:#8B5CF6; --primary-dark:#7C3AED; --primary-soft:#F3EFFF;
    --sidebar:rgba(255,255,255,0.72); --sidebar-active:rgba(139,92,246,0.12); --sidebar-text:#64748B;
    --bg:linear-gradient(135deg,#EEF2FF 0%,#F5F3FF 30%,#FDF4FF 60%,#FFF7ED 100%); --surface:rgba(255,255,255,0.82); --border:rgba(226,232,240,0.8); --border-strong:#CBD5E1;
    --blue:#60A5FA; --teal:#34D399; --purple:#A78BFA; --amber:#FBBF24; --red:#F87171; --yellow:#FCD34D; --green:#4ADE80; --pink:#F9A8D4;
    --t1:#334155; --t2:#64748B; --t3:#94A3B8; --inverse:#FFFFFF;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
    --shadow:0 2px 12px rgba(99,102,241,.08),0 1px 3px rgba(0,0,0,.04);

    --glass-bg:rgba(255,255,255,0.72);
    --glass-border:rgba(255,255,255,0.5);
  --topnav-h:60px;}
  /* 主题：抹茶绿 */
  body.theme-green{--primary:#2FB37A;--primary-dark:#239A66;--primary-soft:#E6F6EE;--sidebar:#1F3D2E;--sidebar-active:#2C5640;--sidebar-text:#BFE3CF}
  /* 主题：温馨教育风 */
  body.theme-warm{--primary:#E8743B;--primary-dark:#CF5E27;--primary-soft:#FDEFE6;--sidebar:#7A3B2E;--sidebar-active:#9A4B38;--sidebar-text:#F3D9CE}
  /* 主题：渐变毛玻璃 */
  body.theme-glass{--primary:#6D5DF6;--primary-dark:#5446D6;--primary-soft:#ECEAFF;--sidebar:#3A2E6E;--sidebar-active:#4A3C86;--sidebar-text:#D9D2FF;--bg:linear-gradient(135deg,#eef2ff,#fdf2f8,#fffbeb)}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;margin:0}

  .nav-item.ai{color:#9DB4FF}
  .nav-item.ai:hover{background:rgba(155,180,255,.12)}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}

  .retire-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#F59E0B,#EF4444);color:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 10px rgba(245,158,11,.45);margin-left:8px;cursor:pointer;white-space:nowrap;transition:.2s}

  .btn-sm{padding:5px 10px;font-size:13px}
  .content{flex:1;overflow-y:auto;padding:24px}

  /* cards */
  .section{margin-bottom:24px}
  /* ===== v1.2.0 视觉增强 ===== */
  .card{transition:box-shadow .2s,border-color .2s}
  .card:hover{border-color:var(--border-strong);box-shadow:0 4px 14px rgba(16,32,58,.08)}

  .card.hero-holiday *{color:#fff!important;}
  .nav-group-label{color:rgba(255,255,255,.45)}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 2px 6px rgba(43,127,255,.25)}
  .btn-primary:hover{box-shadow:0 4px 12px rgba(43,127,255,.35);transform:translateY(-1px)}
  .btn{box-shadow:0 1px 2px rgba(16,32,58,.05)}
  .topbar .title{display:flex;align-items:center;gap:10px}
  .topbar .title::before{content:"";width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--primary-dark))}
  .data-card{border-top:3px solid var(--primary);background:linear-gradient(180deg,#fff,var(--primary-soft))}
  .data-num{background:linear-gradient(135deg,var(--primary),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .empty{background:var(--surface);border:1.5px dashed var(--border-strong);border-radius:var(--r-lg)}
  .note-box{border-left:3px solid var(--primary);background:var(--primary-soft)}
  .modal{border-radius:var(--r-xl)}
  .section-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .section-title::before{content:"";width:4px;height:15px;background:var(--primary);border-radius:2px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .dash-stats-grid{grid-template-columns:repeat(4,1fr)!important}
  .dash-stats-grid .card{display:flex;align-items:center;min-height:110px;padding:16px}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-side{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  /* 选科模式（v1.4.0）：全国通用多模式（3+1+2 / 3+3 / 老高考 / 自由），结构化选择 + 快捷组合 */
  .sel-modebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

  .sel-opt .lbl{font-size:13px;font-weight:600;min-width:96px;color:var(--t2)}
  .sel-chip{display:inline-flex;align-items:center;padding:6px 15px;border:1px solid var(--border-strong);border-radius:999px;cursor:pointer;font-size:13px;color:var(--t1);background:var(--surface);user-select:none;transition:all .15s}
  .sel-chip:hover{border-color:var(--primary);color:var(--primary)}
  .sel-chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .sel-quick{padding-top:10px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sel-quick .q{display:inline-flex;padding:4px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:12px;cursor:pointer;color:var(--primary);background:transparent;transition:all .15s}
  .sel-quick .q:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* 仪表盘自由布局（v1.3.7）：模块可拖动排序（边缘自动滚动）、拖动右缘手柄调宽 */
  .dash-edit-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}

  .dash-grid>.section.col-4{grid-column:span 4}
  .dash-grid>.section.col-6{grid-column:span 6}
  .dash-grid>.section.col-8{grid-column:span 8}
  .dash-grid>.section.col-10{grid-column:span 10}
  .dash-grid>.section.col-12{grid-column:span 12}
  .dash-grid.editing{padding-top:2px}
  .dash-grid.editing>.section{position:relative;outline:1px dashed var(--primary);outline-offset:4px;border-radius:var(--r-lg)}
  .dash-grid.editing>.section.resizing{outline:2px solid var(--primary);outline-offset:5px}
  .dash-resize-h{display:none;position:absolute;top:50%;right:-7px;transform:translateY(-50%);width:14px;height:64px;z-index:6;cursor:ew-resize;touch-action:none;align-items:center;justify-content:center;pointer-events:auto}
  .dash-grid.editing>.section .dash-resize-h{display:flex}
  .dash-resize-h::before{content:"";width:5px;height:44px;border-radius:999px;background:var(--primary);opacity:.45;transition:opacity .15s,height .15s}
  .dash-resize-h:hover::before,.dash-resize-h:active::before{opacity:1;height:56px;box-shadow:0 0 0 3px rgba(43,127,255,.15)}
  .dash-grid.editing>.section.drag-over{outline:2px solid var(--primary);outline-offset:5px;background:rgba(43,127,255,.05)}
  .dash-grid.editing>.section.dragging{outline-style:dotted;opacity:.55}
  .dash-grid.editing>.section .card,.dash-grid.editing>.section .grid-4{pointer-events:none;user-select:none}
  .dh-bar{display:flex;align-items:center;gap:8px;margin:-8px -8px 12px;padding:6px 8px;background:rgba(43,127,255,.07);border:1px dashed rgba(43,127,255,.35);border-radius:9px}
  .dh-name{font-size:12px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:5px}
  .dh-grip{cursor:grab;touch-action:none;font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--primary);background:#fff;color:var(--primary);display:inline-flex;align-items:center;gap:4px;line-height:1.5}
  .dh-grip:active{cursor:grabbing}
  .dh-grip:hover{background:var(--primary);color:#fff}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
  .card.pad0{padding:0;overflow:hidden}
  .stat{display:flex;align-items:flex-start;gap:12px}
  .stat .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 10px}
  .stat .meta .k{font-size:13px;color:var(--t3)}
  .stat .meta .v{font-size:26px;font-weight:700;line-height:1.2}
  .stat .meta .s{font-size:12px;color:var(--t2);margin-top:2px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  .card-head h3{font-size:15px;font-weight:700}
  .link{color:var(--primary);font-size:13px;cursor:pointer}
  .link:hover{text-decoration:underline}

  .warn-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
  .warn-item:first-child{border-top:none}
  .warn-item .ava{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:0 0 34px}
  .warn-item .nm{font-weight:600}
  .warn-item .cl{font-size:12px;color:var(--t3)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);white-space:nowrap}
  .tag.red{background:#FEE2E2;color:#C53030}
  .tag.amber{background:#FEF3C7;color:#B45309}
  .tag.teal{background:#D1FAE5;color:#047857}
  .tag.purple{background:#EDE9FE;color:#6D28D9}
  .tag.green{background:#DCFCE7;color:#15803D}
  .tag.gray{background:#EEF1F5;color:var(--t2)}
  .tag.blue{background:#DBEAFE;color:#1D4ED8}

  .todo{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}

  .todo .tt{flex:1;font-size:14px}

  .period .rm{font-size:12px;color:var(--t3)}

  .rm-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--t2)}
  .rm-item:first-child{border-top:none}
  .rm-no{flex:0 0 20px;height:20px;border-radius:50%;background:var(--bg);color:var(--t3);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .rm-ic{flex:0 0 auto;font-size:14px;line-height:1.6}
  .rm-tx{flex:1}
  .rm-more{margin-top:6px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px;color:var(--t3);text-align:center}

  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .quick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:var(--r-md);background:var(--bg);transition:.15s}
  .quick button:hover{background:var(--primary-soft);transform:translateY(-2px)}
  .quick .qi{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary);box-shadow:var(--shadow)}

  .quick .ql{font-size:13px;color:var(--t1)}

  .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:4px;background:var(--primary)}

  .rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
  .rank:first-child{border-top:none}
  .rank .no{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 24px}
  .rank .no.gold{background:#FEF3C7;color:#B45309}
  .rank .no.silver{background:#F1F5F9;color:#64748B}
  .rank .no.bronze{background:#FDE9D3;color:#B45309}
  .rank .no.plain{background:var(--bg);color:var(--t2)}
  .rank .ava{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 30px}
  .rank .nm{flex:1;font-weight:600}
  .rank .sc{font-weight:700;color:var(--primary)}

  /* toolbar/tabs/search */
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:14px;color:var(--t2);cursor:pointer}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .tab:hover{border-color:var(--primary)}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;min-width:200px}
  .search svg{width:16px;height:16px;color:var(--t3)}
  .search input{border:none;outline:none;flex:1;font-size:14px;background:transparent;min-width:80px}
  .select{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;font-size:14px;color:var(--t1);outline:none;max-width:200px}
  .count-pill{font-size:13px;color:var(--t3)}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:12px;color:var(--t3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
  tbody tr{cursor:pointer;transition:.1s}
  tbody tr:hover{background:var(--primary-soft)}
  .stu{display:flex;align-items:center;gap:10px}
  .stu .ava{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 32px}
  .mini-bar{width:90px;height:6px;border-radius:3px;background:var(--bg);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .mini-bar > i{display:block;height:100%}
  .row-actions{display:flex;gap:8px;justify-content:flex-end}
  .icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);background:var(--bg)}
  .icon-btn:hover{background:var(--primary-soft);color:var(--primary)}
  .icon-btn.del:hover{background:#FEE2E2;color:var(--red)}
  .icon-btn svg{width:16px;height:16px}
  .empty{padding:50px 20px;text-align:center;color:var(--t3)}
  .empty .big{font-size:40px;margin-bottom:10px}

  /* placeholder */
  .ph{padding:80px 20px;text-align:center}
  .ph .ic{width:64px;height:64px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .ph .ic svg{width:32px;height:32px}
  .ph h2{font-size:18px;margin-bottom:6px}
  .ph p{color:var(--t3);font-size:14px}

  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(16,32,58,.45);display:flex;justify-content:flex-end;z-index:60;opacity:0;pointer-events:none;transition:.2s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{width:440px;max-width:94vw;background:#fff;height:100%;overflow-y:auto;transform:translateX(30px);transition:.2s;padding:24px}
  .overlay.open .drawer{transform:none}
  .drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .drawer .dh h3{font-size:18px}
  .drawer .hero{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .drawer .hero .ava{width:56px;height:56px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:0 0 56px}
  .drawer .hero .nm{font-size:20px;font-weight:700}
  .drawer .hero .cl{font-size:13px;color:var(--t3)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:14px}
  .kv .k{color:var(--t3);flex:0 0 auto}
  .kv .v{font-weight:600;text-align:right}
  .sub-sec{margin-top:18px}
  .sub-sec h4{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .sub-sec h4::before{content:"";width:3px;height:13px;background:var(--primary);border-radius:2px}
  .rec-row{font-size:13px;padding:8px 0;border-top:1px solid var(--border);color:var(--t2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rec-row b{flex:0 1 auto;min-width:0}
  .rec-row .link,.rec-row .muted{flex:0 0 auto}
  .rec-row b{color:var(--t1)}

  /* modal */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:4000;display:none;align-items:flex-start;justify-content:center;padding:80px 8px 24px;overflow-y:auto}
  .modal-mask.open{display:flex}
  .modal{background:#fff;border-radius:var(--r-lg);max-width:680px;width:min(92vw,680px);max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .18s ease}
  .modal.modal-wide{max-width:min(96vw,1200px)!important;width:96vw!important}
  .modal.modal-xwide{max-width:98vw!important;width:98vw!important}
  /* v2.0.5 弹窗自适应：宽度由内容决定（学生名单/表格/多选/双列表单自动加宽），窄屏自动回缩；!important 压过全局 .modal 尺寸 */
  .modal.modal-auto{width:auto!important;min-width:min(92vw,420px)!important;max-width:min(94vw,1100px)!important}
  /* v2.0.5-4 大弹窗（wide/xwide/auto）改用纯白实色背景：backdrop-filter 毛玻璃在大尺寸+滚动容器上会导致背景透明异常、文字看不清 */
  .modal.modal-wide,.modal.modal-xwide,.modal.modal-auto{
    background:#fff!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
  }
  @keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.6}to{transform:none;opacity:1}}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
  .modal .mh h3{font-size:17px;font-weight:700}
  .modal .mb{padding:20px 22px;overflow-y:auto}
  .modal .mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
  /* v2.0.5-4-8 批量积分学生平铺：简单 checkbox + 姓名，无卡片样式 */
  .mclose{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:18px}
  .mclose:hover{background:var(--bg)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--t2);margin-bottom:6px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border-strong);border-radius:var(--r-md);padding:10px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--t1)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
  .field textarea{resize:vertical;min-height:80px}
  .grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{padding:7px 14px;border-radius:999px;border:1px solid var(--border-strong);background:#fff;font-size:13px;color:var(--t2)}
  .seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .hint{font-size:12px;color:var(--t3);margin-top:4px}

  /* charts */
  .chart-pie{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .pie-legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .pie-legend .li{display:flex;align-items:center;gap:8px}
  .pie-legend .sw{width:12px;height:12px;border-radius:3px}
  .hbars .hb{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
  .hbars .hb:first-child{border-top:none}
  .hbars .hb .lbl{width:96px;flex:0 0 96px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbars .hb .track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
  .hbars .hb .track > i{display:block;height:100%}
  .hbars .hb .val{width:48px;text-align:right;font-weight:600}
  .linechart{width:100%}

  /* seats */
  .seat-wrap{overflow:auto}
  .podium{text-align:center;padding:10px;margin:0 auto 18px;width:160px;background:var(--primary-soft);color:var(--primary-dark);border-radius:var(--r-md);font-weight:600}
  .seat-grid{display:grid;gap:8px;margin:0 auto}
  .seat{aspect-ratio:1;border-radius:10px;border:2px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:2px;background:var(--bg);cursor:pointer;position:relative;transition:.12s;color:var(--t2)}
  .seat.filled{background:#fff;border-style:solid;border-color:var(--blue);color:var(--t1);font-weight:600;cursor:grab}
  .seat.filled.m{background:#EFF5FF;border-color:var(--blue)}
  .seat.filled.f{background:#FDF0F6;border-color:#EC4899}
  .seat .badge-dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .seat .seat-name{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit}
  .seat-grid.desk-mode{gap:12px 14px}
  .desk{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:3px}
  .desk .seat{aspect-ratio:auto;min-height:54px;flex:1;min-width:0;border-radius:9px}
  .aisle{background:transparent}

  /* 普通日历 */
  .cal-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
  .cal-left{display:flex;flex-direction:column;min-width:0}
  .cal-month{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 12px;display:flex;flex-direction:column;flex:1;min-width:0}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-nav .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;color:var(--t2)}
  .cal-nav .icon-btn:hover{border-color:var(--primary);color:var(--primary)}
  .cal-title{font-weight:700;font-size:15px}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--t3);font-size:11px;margin-bottom:4px;gap:4px}
  .cal-dow span:nth-child(6),.cal-dow span:nth-child(7){color:var(--red);font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1;grid-auto-rows:minmax(64px,auto)}
  .cal-day{min-height:64px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;padding:3px 1px;font-size:13px;background:var(--bg);border:1px solid var(--border);transition:.12s;overflow:hidden}
  .cal-grid .cal-day:nth-child(7n),.cal-grid .cal-day:nth-child(7n-1){background:var(--primary-soft)}
  .cal-day.today{border-color:var(--primary);background:var(--primary-soft);font-weight:700;box-shadow:inset 0 0 0 2px var(--primary)}
  .cal-day .cal-num{font-style:normal;font-size:14px;font-weight:600;line-height:1.15}
  .cal-day .cal-lunar{font-size:9px;color:var(--t3);line-height:1.2;font-style:normal}
  .cal-day .cal-term{font-size:9px;color:var(--red);font-weight:600;line-height:1.2;font-style:normal}
  .cal-tag{font-size:9px;line-height:1.15;display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .cal-tag.legal{color:var(--red);font-weight:600}
  .cal-tag.fest{color:var(--blue);font-weight:500}
  .cal-tag.memo{color:#64748B;font-weight:500}
  .cal-tag.cnt{font-size:10px}
  .cal-emo{font-size:10px;line-height:1.2;display:inline-block}
  .icon-grid{display:flex;flex-wrap:wrap;gap:6px}
  .icon-pick{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface);transition:.12s}
  .icon-pick:hover{border-color:var(--primary)}
  .icon-pick.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 2px rgba(43,127,255,.2)}
  .cal-pri{width:7px;height:7px;border-radius:50%;display:inline-block;margin:0 1px}
  .cal-pri.hi{background:#EF4444}
  .cal-pri.md{background:#F59E0B}
  .cal-pri.lo{background:#22C55E}
  .day-actions{display:flex;gap:10px;margin:10px 0}
  .day-actions .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px}
  .cal-empty{background:transparent;border:none;min-height:64px}
  .cal-right{display:flex;flex-direction:column;gap:14px}
  .cal-right .card{flex:0 0 auto}
  .cal-bottom{margin-top:16px}
  @media(max-width:1000px){.cal-layout{grid-template-columns:1fr}.cal-right{flex-direction:row;align-items:stretch;flex-wrap:wrap}.cal-right .card{flex:1;min-width:220px}}
  @media(max-width:620px){.cal-right{flex-direction:column}}
  /* 窄屏日历：缩小间距与字号，避免周末格被挤扁 */
  @media(max-width:560px){
    .cal-month{padding:10px 6px}
    .cal-grid,.cal-dow{gap:2px}
    .cal-day{min-height:48px;padding:2px 0;border-radius:6px}
    .cal-empty{min-height:48px}
    .cal-day .cal-num{font-size:12px}
    .cal-day .cal-lunar,.cal-day .cal-term{font-size:8px}
    .cal-tag{font-size:8px}
    .cal-emo{font-size:9px}
  }

  /* timetable */
  .tt{width:100%;border-collapse:collapse;font-size:13px}
  .tt th,.tt td{border:1px solid var(--border);padding:0;height:46px;text-align:center;vertical-align:middle}
  .tt th{background:var(--bg);color:var(--t2);font-weight:600}
  .tt .cell{cursor:pointer;padding:4px 6px;border-radius:6px;margin:2px;min-height:42px;display:flex;flex-direction:column;justify-content:center}
  .tt .cell:hover{outline:2px solid var(--primary)}
  .tt .cell .sb{font-weight:600}
  .tt .cell .tc{font-size:11px;color:var(--t3)}
  .tt .period-col{width:64px;background:var(--bg);font-size:12px;color:var(--t2)}

  /* quadrant */
  .quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .quad{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;background:var(--surface)}
  .quad h4{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .quad .dotc{width:10px;height:10px;border-radius:50%}

  /* misc */
  .data-card{text-align:center;padding:24px}
  .data-num{font-size:34px;font-weight:700;color:var(--primary)}
  .data-sub{color:var(--t3);font-size:13px;margin-top:4px}
  .danger-zone{border:1px solid #FECACA;background:#FFF5F5;border-radius:var(--r-lg);padding:20px;margin-top:8px}
  .danger-zone h3{color:#C53030;font-size:15px;margin-bottom:6px}
  .danger-zone p{color:var(--t2);font-size:13px;margin-bottom:14px}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--sidebar);color:#fff;padding:12px 20px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:90;font-size:14px;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;display:none}
  .backdrop.show{display:block}
  .mtab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .mtab button{padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--t2)}
  .mtab button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .contact-card{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--r-md);background:#fff}
  .contact-card .ava{width:44px;height:44px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 44px}
  .cc-body{flex:1;min-width:0}
  .cc-name{font-weight:600;font-size:13px}
  .cc-block{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .cc-block:first-of-type{border-top:none;margin-top:6px;padding-top:0}
  .cc-row{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px;flex-wrap:wrap}
  .cc-role{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:1px 6px;border-radius:4px}
  .cc-nm{flex:0 0 auto;font-weight:600;color:var(--t1)}
  .cc-ph{flex:0 0 auto;color:var(--t1);font-variant-numeric:tabular-nums}
  .cc-note{display:flex;align-items:center;gap:6px;margin-top:5px}
  .cc-note-label{flex:0 0 auto;font-size:11px;color:var(--t3)}
  .contact-note{flex:1;min-width:0;padding:3px 8px;font-size:11px;border:1px solid var(--border);border-radius:6px;color:var(--t1);background:#fff;box-sizing:border-box}
  .contact-note:focus{outline:none;border-color:var(--primary)}
  .note-box{background:var(--bg);border-radius:var(--r-md);padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--t1)}
  .upload{border:2px dashed var(--border-strong);border-radius:var(--r-md);padding:18px;text-align:center;color:var(--t3);cursor:pointer;transition:.15s}
  .upload:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark)}
  .clock{font-variant-numeric:tabular-nums}
  .topclock{font-size:13px;color:var(--t1);font-weight:700;font-variant-numeric:tabular-nums;margin-right:14px;white-space:nowrap}
  .muted{color:var(--t3)}
  .scroll-x{overflow-x:auto}
  /* v2 模块表格容器：窄屏横向滚动，防溢出 */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-wrap table{min-width:560px}
  /* 说明文字（v2 模块小字辅助说明） */
  .note{font-size:12px;color:var(--t2);line-height:1.6}
  .tag-list{display:flex;flex-wrap:wrap;gap:6px}
  /* 成绩明细表格（成绩管理-个人/档案明细） */
  .score-tbl{width:100%;border-collapse:collapse}
  .score-tbl th,.score-tbl td{border:1px solid var(--border-strong);padding:7px 10px;text-align:center;font-size:13px;white-space:nowrap}
  .score-tbl th{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
  .score-tbl tbody tr:hover{background:rgba(139,92,246,.04)}
  /* 选科模式说明框 / 单科趋势 chips */
  .sel-mode-note{margin:10px 0;font-size:13px;line-height:1.9}
  .sub-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .linechart{display:block;width:100%;max-width:400px;height:150px;margin:6px auto}

  /* 德育活动 */
  .t-honor-wrap{display:grid;grid-template-columns:1fr;gap:10px}
  .t-honor{position:relative;background:#FFFDF5;border:1px solid #F3E4B5;border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);font-family:Georgia,"KaiTi","楷体",serif}
  .t-honor .t-h{font-weight:700;font-size:14px;color:#7C5E10;margin-bottom:2px}
  .t-honor .t-s{font-size:12px;color:#A98B3F}
  .t-honor .t-n{font-size:12px;color:#8A7350;margin-top:4px;font-style:italic}
  .dotline{display:inline-block;border-bottom:1px solid #333;min-width:90px;height:20px}
  .role-chips{display:flex;flex-wrap:wrap;gap:6px}
  .role-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border-strong);border-radius:999px;font-size:13px;cursor:pointer;background:#fff}

  /* ============================================================

  html,body{height:100%;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;

    background:radial-gradient(circle,rgba(167,139,250,0.25),transparent 70%);
    border-radius:50%;pointer-events:none;z-index:0;

  body::after{
    content:'';position:fixed;bottom:-150px;left:-100px;width:500px;height:500px;

    border-radius:50%;pointer-events:none;z-index:0;
  }

  function computeRank(students){
    // v2.0.3.6 修复：原硬编码只处理 c1/c2 两个班级，自建/导入班级学生排名永远不计算（显示第0名）
    // 改为按学生 id 前缀动态分组（每个班级独立排名），无成绩学生 rank 置 0（表示未参与排名）
    var groups={};
    students.forEach(function(s){
      var cid=(s.id||"").split("-")[0];
      if(!groups[cid])groups[cid]=[];
      groups[cid].push(s);
    });
    Object.keys(groups).forEach(function(cid){
      groups[cid].filter(function(s){return s.score!=null;})
        .sort(function(a,b){return (b.score||0)-(a.score||0);})
        .forEach(function(s,i){s.rank=i+1;});
      groups[cid].forEach(function(s){if(s.score==null)s.rank=0;});
    });
  }
  function genScores(students, exam){
    var rows=[];
    students.forEach(function(s){
      var subs=exam.subjects.map(function(sub){
        var base = s.score + rint(-12,12);
        base = Math.max(20, Math.min(sub.full, Math.round(base/sub.full*100)));
        return {name:sub.name, score:Math.round(base/sub.full*sub.full)};
      });
      var total = roundScore(subs.reduce(function(a,b){return a+b.score;},0));
      rows.push({id:uid(),examId:exam.id,studentId:s.id,subjects:subs,total:total,rank:0});
    });
    rows.sort(function(a,b){return b.total-a.total;}).forEach(function(r,i){r.rank=i+1;});
    return rows;
  }

    if(opt.body)h["Content-Type"]="application/json";
    var fopt={method:opt.method||"GET",headers:h};
    if(opt.body)fopt.body=opt.body;
    return fetch(GIST_API+path,fopt).then(function(res){
      if(res.status===401&&t&&retried===0){
        return wdvFetch(path,opt,1); // 兼容 fine-grained（Bearer）与 classic（token）两种 Token
      }
      if(!res.ok){
        return res.text().then(function(txt){
          var msg="HTTP "+res.status;
          try{var j=JSON.parse(txt);if(j&&j.message)msg=j.message;}catch(e){}
          throw new Error(msg);
        });
      }
      return res.status===204?null:res.json();
    });
  }

  function wdvEnsureGist(){
    if(wdv.cfg.gistId)return Promise.resolve(wdv.cfg.gistId);
    return wdvFetch("/gists?per_page=100").then(function(list){
      if(list&&list.length){
        for(var i=0;i<list.length;i++){
          if(list[i].description===GIST_DESC&&list[i].files&&list[i].files[GIST_FILE]){
            wdv.cfg.gistId=list[i].id;wdvSaveCfg();return wdv.cfg.gistId;
          }
        }
      }
      var body={description:GIST_DESC,"public":false,files:{}};
      body.files[GIST_FILE]={content:wdvBuildPayload()};
      return wdvFetch("/gists",{method:"POST",body:JSON.stringify(body)}).then(function(g){
        wdv.cfg.gistId=g.id;wdvSaveCfg();return wdv.cfg.gistId;
      });
    });

  function wdvPush(){
    if(wdv.busy)return Promise.resolve(false);
    if(!wdv.cfg.token)return Promise.resolve(false);
    if(wdv.localUpdatedAt===0)wdv.localUpdatedAt=Date.now();
    wdv.busy=true;
    wdvSetStatus("正在上传…");
    return wdvEnsureGist().then(function(id){
      var body={files:{}};
      body.files[GIST_FILE]={content:wdvBuildPayload()};
      return wdvFetch("/gists/"+id,{method:"PATCH",body:JSON.stringify(body)}).then(function(){
        wdv.busy=false;wdv.pulledOnce=true;
        wdvSetStatus("✅ 已同步 "+fmtTime(Date.now()));
        wdvSaveCfg();return true;
      });
    }).catch(function(e){
      wdv.busy=false;wdv.lastErr=e.message;
      wdvSetStatus("❌ 上传失败："+e.message);
      wdvSaveCfg();return false;
    });
  }
  function wdvPull(){
    if(wdv.busy)return Promise.resolve();
    if(!wdv.cfg.token||!wdv.cfg.enabled)return Promise.resolve();
    function doPull(){
      if(!wdv.cfg.gistId){
        if(wdv.localUpdatedAt===0)wdv.localUpdatedAt=Date.now();
        wdv.pulledOnce=true;
        return wdvPush();
      }
      wdv.busy=true;
      wdvSetStatus("正在拉取…");
      return wdvFetch("/gists/"+wdv.cfg.gistId).then(function(g){
        wdv.busy=false;wdv.pulledOnce=true;
        var content=null;
        if(g&&g.files&&g.files[GIST_FILE])content=g.files[GIST_FILE].content;
        if(!content){wdvPush();return;}
        var remote=null;
        try{remote=JSON.parse(content);}catch(e){}
        var rt=remote&&remote.updatedAt?remote.updatedAt:0;
        var lt=wdv.localUpdatedAt||0;
        if(rt>lt){
          var remoteEmpty=!remote.data||!remote.data.students||remote.data.students.length===0;
          var localHas=DB&&DB.students&&DB.students.length>0;
          if(remoteEmpty&&localHas){
            wdvSetStatus("⚠️ 云端数据为空，已保留本地数据并上传");
            wdv.localUpdatedAt=Date.now();wdvSaveCfg();wdvPush();return;
          }
          try{
            var d=migrate(remote.data);
            wdv.applyingRemote=true;
            DB=d;wdv.localUpdatedAt=rt;
            save();render();
            wdv.applyingRemote=false;
            wdvSetStatus("✅ 已从云端更新 "+fmtTime(rt));
            wdvSaveCfg();
          }catch(e){
            wdv.lastErr=e.message;
            wdvSetStatus("❌ 云端数据解析失败："+e.message);
            wdvSaveCfg();
          }
        }else if(lt>rt){
          wdvPush();
        }else{
          wdvSetStatus("✅ 已是最新 "+fmtTime(Date.now()));
          wdvSaveCfg();
        }
      }).catch(function(e){
        wdv.busy=false;wdv.lastErr=e.message;
        wdvSetStatus("❌ 拉取失败："+e.message);
        wdvSaveCfg();
      });
    }
    if(!wdv.cfg.gistId){
      wdvSetStatus("正在查找云端数据…");
      return wdvEnsureGist().then(function(){ doPull(); });
    }
    return doPull();
  }

    wdv.localUpdatedAt=Date.now();

  // 修复重复学生（v1.4.1）：清理智能导入误产生的「同名/同学号重复学生」——把重复学生的成绩/积分/违纪/谈话/家校/荣誉等迁移到保留的学生，再删除重复项
  function dedupStudents(){
    var removed=0,transfered=0;
    var keep={},drop=[];
    DB.students.forEach(function(s){
      var key=(s.name||"")+"|"+(s.no||"");
      if(!key||key==="|")return;
      if(keep[key]!==undefined){
        // 保留先出现的（通常是早先创建的、有完整数据的），删除后出现的重复项
        var keeper=DB.students[keep[key]];
        var scoreKeep=keeper.score!=null?keeper.score:(s.score!=null?s.score:null);
        if(keeper.score==null&&s.score!=null)keeper.score=s.score;
        drop.push(s);removed++;
      }else{
        keep[key]=DB.students.indexOf(s);
      }
    });
    var dropIds={};drop.forEach(function(s){dropIds[s.id]=1;});
    if(removed){
      // 迁移重复学生的关联数据到保留学生
      var map={};
      drop.forEach(function(s){
        var key=(s.name||"")+"|"+(s.no||"");
        if(map[key]===undefined)map[key]=s;
      });
      // 用「姓名|学号」找到保留学生
      drop.forEach(function(s){
        var key=(s.name||"")+"|"+(s.no||"");
        var ki=keep[key];
        if(ki===undefined)return;
        var keeper=DB.students[ki];
        if(!keeper)return;
        // 成绩
        DB.scores.forEach(function(sc){
          if(sc.studentId===s.id){sc.studentId=keeper.id;transfered++;}
        });
        // 积分/违纪/谈话/家校/荣誉/请假/资助/评价/心理等
        DB.points.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
        DB.discipline.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
        DB.talks.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
        DB.communications.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
        DB.honors.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
        DB.leaves.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
        DB.specialAid.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
        DB.evaluations.forEach(function(x){if(x.studentId===s.id){x.studentId=keeper.id;transfered++;}});
      });
      DB.students=DB.students.filter(function(s){return !dropIds[s.id];});
      computeRank(DB.students);
      syncScoreFromExams();
      save();
    }
    return {removed:removed,transfered:transfered};
  }

  function migrate(d){
    if(!d||!d.students) return null;
    d.version=2;
    ["classes","exams","scores","attendance","leaves","points","discipline","homework","communications","notices","specialAid","todos","schedule","workLogs","talks","meeting","resources","recitation","countdownEvents","honors","evaluations"].forEach(function(k){ if(!d[k]) d[k]=[]; });
    // v2.0.2 数据迁移：给旧考勤记录添加 period 字段（全天/上午/下午）
    d.attendance.forEach(function(a){if(!a.period)a.period="all";});
    // v2.0.3 数据迁移：清理历史冗余考勤记录——旧版本打开考勤页会为每个时段自动生成全员出勤记录（5时段×48人=240条）。
    // 精细规则：同一学生同一天存在「全天」记录时，
    //   - 分时段记录若状态为出勤(present) → 视为旧版自动生成的冗余，删除；
    //   - 分时段记录若状态为请假/迟到/缺勤 → 用户手动操作，必须保留，绝不误删。
    if(Array.isArray(d.attendance)&&d.attendance.length){
      var _allDay={};d.attendance.forEach(function(a){if(!a.night&&(a.period||"all")==="all")_allDay[a.date+"|"+a.studentId]=1;});
      if(Object.keys(_allDay).length){
        d.attendance=d.attendance.filter(function(a){
          if(a.night)return true; // 查寝记录不动
          var p=a.period||"all";
          if(p==="all")return true;
          if(a.status!=="present")return true; // 用户手动标记的异常状态，保留
          return !_allDay[a.date+"|"+a.studentId]; // 仅删除冗余的全勤分时段
        });
      }
    }
    d.leaves.forEach(function(l){if(!l.leavePeriod)l.leavePeriod="all";});
    // v2.0.3.6 修复存量浮点尾差：历史成绩总分/综合成绩统一保留 1 位小数（347.40000000000003 → 347.4）
    if(Array.isArray(d.scores))d.scores.forEach(function(r){if(typeof r.total==="number")r.total=Math.round(r.total*10)/10;});
    if(Array.isArray(d.students))d.students.forEach(function(s){if(typeof s.score==="number")s.score=Math.round(s.score*10)/10;});
    d.teacherHonors=d.teacherHonors||[];
    d.activities=d.activities||[];
    d.weekendOut=d.weekendOut||[];
    d.holidays=d.holidays||[];
    // v2.0.3.6 突发事件图片迁移：旧单图 image 字段 → images 数组（多图兼容）
    if(Array.isArray(d.incidents))d.incidents.forEach(function(it){
      if(!it.images&&it.image)it.images=[it.image];
      if(!it.images)it.images=[];
      if(!it.image&&it.images.length)it.image=it.images[0];
    });
    d.tagLib=d.tagLib||["尖子生","临界生","学困生","特长生","心理重点关注","特异体质","留守学生","贫困学生","选科物化生","选科史地政"];
    d.quality=d.quality||{};
    d.subjectSelection=d.subjectSelection||{};
    d.seatSetting=d.seatSetting||{rows:6,cols:8,layout:[]};
    d.seatSetting.desk=d.seatSetting.desk||1;
    d.seatSetting.aisleCount=d.seatSetting.aisleCount||0;
    // v1.4.1 修复：layout 必须与 rows×cols 匹配，否则渲染座位表崩溃（Cannot read '0' of undefined）
    (function fixSeatLayout(){
      var ss=d.seatSetting;
      ss.rows=Math.max(1,parseInt(ss.rows,10)||6);
      ss.cols=Math.max(1,parseInt(ss.cols,10)||8);
      if(!Array.isArray(ss.layout))ss.layout=[];
      while(ss.layout.length<ss.rows)ss.layout.push(new Array(ss.cols).fill(null));
      for(var ri=0;ri<ss.layout.length;ri++){
        if(!Array.isArray(ss.layout[ri]))ss.layout[ri]=new Array(ss.cols).fill(null);
        while(ss.layout[ri].length<ss.cols)ss.layout[ri].push(null);
        if(ss.layout[ri].length>ss.cols)ss.layout[ri].length=ss.cols;
      }
      if(ss.layout.length>ss.rows)ss.layout.length=ss.rows;
    })();

  /* ============ 图表 ============ */
  function hBars(items,max){
    max=max||Math.max.apply(null,items.map(function(i){return i.value;}).concat([1]));
    return '<div class="hbars">'+items.map(function(i){
      var pct=Math.max(2,Math.round(i.value/max*100));
      return '<div class="hb"><span class="lbl">'+esc(i.label)+'</span><span class="track"><i style="width:'+pct+'%;background:'+(i.color||"var(--blue)")+'"></i></span><span class="val">'+i.value+'</span></div>';
    }).join("")+'</div>';
  }
  function pieChart(segs){
    var total=segs.reduce(function(a,s){return a+s.value;},0)||1;
    var r=54,cx=60,cy=60,C=2*Math.PI*r;var acc=0;
    var paths=segs.map(function(s){
      var frac=s.value/total; var len=frac*C;
      var dash=len+" "+(C-len); var off=-acc*C;
      acc+=frac;
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="20" stroke-dasharray="'+dash+'" stroke-dashoffset="'+off+'" transform="rotate(-90 60 60)"></circle>';
    }).join("");
    var legend=segs.map(function(s){return '<div class="li"><span class="sw" style="background:'+s.color+'"></span>'+esc(s.label)+' '+s.value+'</div>';}).join("");
    return '<div class="chart-pie"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#EEF1F5" stroke-width="20"></circle>'+paths+'</svg><div class="pie-legend">'+legend+'</div></div>';
  }
  function lineChart(values,labels,color){
    color=color||"var(--primary)";
    var w=320,h=120,pad=20;var max=Math.max.apply(null,values.concat([1])),min=Math.min.apply(null,values.concat([0]));
    var range=(max-min)||1;
    var pts=values.map(function(v,i){
      var x=pad+(w-2*pad)*(values.length>1?i/(values.length-1):0.5);
      var y=h-pad-(v-min)/range*(h-2*pad);
      return x+","+y;
    }).join(" ");
    var dots=values.map(function(v,i){
      var x=pad+(w-2*pad)*(values.length>1?i/(values.length-1):0.5);
      var y=h-pad-(v-min)/range*(h-2*pad);
      return '<circle cx="'+x+'" cy="'+y+'" r="3" fill="'+color+'"></circle>';
    }).join("");
    var xl=labels?labels.map(function(l,i){var x=pad+(w-2*pad)*(labels.length>1?i/(labels.length-1):0.5);return '<text x="'+x+'" y="'+(h-4)+'" font-size="9" fill="#97A1B0" text-anchor="middle">'+esc(l)+'</text>';}).join(""):"";
    return '<svg class="linechart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5"/>'+dots+xl+'</svg>';
  }

  /* ============ 模态框 ============ */
  function modal(title,body,footer,cls){
    cls=cls||"";
    // v2.0.5 弹窗自适应：仅对需要加宽的内容自动 modal-auto——
    // chips 横向多选(flex-wrap)、图片网格、表格类 直接触发；
    // 双列表单(grid-2col)触发，但含 checkbox 竖排列表的（如批量积分选人）保持默认 680 宽，避免内容窄反而缩得更小
    var auto="";
    if(!/modal-(wide|xwide|auto|med)/.test(cls)&&(/flex-wrap:wrap|photo-grid|stu-table|score-tbl|table-wrap|scroll-x/.test(body)||(/grid-2col/.test(body)&&!/checkbox/.test(body))))auto=" modal-auto";
    document.getElementById("modal").innerHTML='<div class="mh"><h3>'+esc(title)+'</h3><button class="mclose" onclick="App.closeModal()">✕</button></div><div class="mb">'+body+'</div><div class="mf">'+footer+'</div>';
    var el=document.getElementById("modal");
    // 类名拼接必须加空格："modal"+" "+cls——否则 "modal"+"modal-med"="modalmodal-med"（单类名），
    // 导致 .modal 的圆角/内边距/flex/max-height 等基础样式全部失效 = 弹窗"没圆角、文字贴边、不美观"的根因
    el.className="modal"+(cls?" "+cls:"")+auto;
    // v2.0.5-4-6 内联强制（最高优先级，杜绝任何样式未生效导致的弹窗透明）：背景实白 + 对应宽度
    // 注意：用 setProperty(...,"important") 才能压过 CSS 里带 !important 的规则（如 modal-auto），否则宽度会被覆盖
    el.style.setProperty("background","#ffffff","important");
    el.style.setProperty("opacity","1","important");
    if(cls.indexOf("modal-xwide")>=0){el.style.setProperty("width","98vw","important");el.style.setProperty("maxWidth","98vw","important");}
    else if(cls.indexOf("modal-wide")>=0){el.style.setProperty("width","96vw","important");el.style.setProperty("maxWidth","min(96vw,1200px)","important");}
    else if(cls.indexOf("modal-med")>=0){el.style.setProperty("width","min(92vw,880px)","important");el.style.setProperty("maxWidth","min(92vw,880px)","important");}
    else if(auto){el.style.setProperty("width","auto","important");el.style.setProperty("minWidth","min(92vw,420px)","important");el.style.setProperty("maxWidth","min(94vw,1100px)","important");}
    else{el.style.setProperty("width","min(92vw,680px)","important");el.style.setProperty("maxWidth","min(94vw,680px)","important");}
    document.getElementById("modalMask").classList.add("open");
  }
  function closeModal(){document.getElementById("modalMask").classList.remove("open");}

  /* ============ 统计 ============ */
  function stats(){
    var total=DB.students.length;
    var warn=DB.students.filter(function(s){return s.warnings.length;});
    var failing=DB.students.filter(function(s){return scoreRate(s)<60;});
    var lowAtt=DB.students.filter(function(s){return s.attendance<0.92;});
    var avg=total?Math.round(DB.students.reduce(function(a,s){return a+s.score;},0)/total):0;
    var avgAtt=total?DB.students.reduce(function(a,s){return a+s.attendance;},0)/total:0;
    var hwRate=DB.homework.length?Math.round(DB.homework.reduce(function(a,h){return a+h.submitted.length;},0)/(DB.homework.reduce(function(a,h){return a+h.submitted.length+h.missing.length;},0)||1)*100):0;
    return {total:total,warn:warn,failing:failing,lowAtt:lowAtt,avg:avg,avgAtt:avgAtt,hwRate:hwRate};

  function renderDashSubjectAvg(dashClass){
    var exam=classExams().slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");})[0];
    if(!exam)return "";
    var sts=DB.students.filter(function(x){return x.id.indexOf(dashClass+"-")===0;});
    var subMap={};
    DB.scores.filter(function(x){return x.examId===exam.id&&sts.some(function(st){return st.id===x.studentId;});}).forEach(function(r){
      r.subjects.forEach(function(sb){if(!subMap[sb.name])subMap[sb.name]={total:0,cnt:0,pass:0};subMap[sb.name].total+=sb.score;subMap[sb.name].cnt++;if(sb.score>=60)subMap[sb.name].pass++;});
    });
    var names=Object.keys(subMap);
    if(!names.length)return '<div class="card"><div class="stat"><span class="dot" style="background:var(--amber)"></span><div class="meta"><div class="k">各科平均分</div><div class="v">—</div><div class="s">暂无成绩 · 去录入</div></div></div></div>';
    var top4=names.slice(0,4);
    var lines=top4.map(function(nm){
      var d=subMap[nm];
      var avg=Math.round(d.total/d.cnt);
      var pr=Math.round(d.pass/d.cnt*100);
      return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px"><span>'+esc(nm)+'</span><b>'+avg+' 分 <span class="muted" style="font-weight:400">及格 '+pr+'%</span></b></div>';
    }).join("");
    var more=names.length>4?'<div class="muted" style="font-size:11px;margin-top:4px">等 '+names.length+' 科 · <a class="link" onclick="App.setView(\'subject\')">查看全部</a></div>':"";
    return '<div class="card"><div class="stat"><span class="dot" style="background:var(--amber)"></span><div class="meta"><div class="k">各科平均分 · '+esc(exam.name)+'</div>'+lines+more+'</div></div></div>';
  }
  function renderDashboard(){
  // v2.0 增强：班费余额、健康预警、未签收通知
  var _fin=DB.finance||{balance:0};
  var _hc=DB.healthChecks||[];
  var _latestHC=_hc.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");})[0];
  var _unpaidFee=(DB.feeItems||[]).reduce(function(a,it){return a+(it.paid?DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;}).length-it.paid.length:0);},0);

    var s=stats();
    var dashClass=DB.setting.dashClass||(DB.classes[0]?DB.classes[0].id:"");
    if(!dashClass||!DB.classes.some(function(c){return c.id===dashClass;}))dashClass=DB.classes[0]?DB.classes[0].id:"";
    var dashList=DB.students.filter(function(x){return x.id.indexOf(dashClass+"-")===0;});
    var card=function(color,k,v,sub){return '<div class="card"><div class="stat"><span class="dot" style="background:'+color+'"></span><div class="meta"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+sub+'</div></div></div></div>';};
    var boys=dashList.filter(function(x){return x.gender==="男";}).length;
    var girls=dashList.length-boys;
    var boarding=dashList.filter(function(x){return x.boarding;}).length;
    var todayLeave=DB.leaves.filter(function(l){return l.status==="已批准"&&l.startDate<=todayStr()&&l.endDate>=todayStr()&&dashList.some(function(x){return x.id===l.studentId;});}).length;
    var _today=todayStr();
    // v2.0.3 修复：时段考勤统计必须按当前班级过滤，否则会把所有班级记录算进单个班级卡片，导致出勤率>100%
    var _inClass=function(sid){return dashList.some(function(x){return x.id===sid;});};
    var _amAtt=DB.attendance.filter(function(a){return a.date===_today&&!a.night&&a.period==="am"&&_inClass(a.studentId);});
    var _pmAtt=DB.attendance.filter(function(a){return a.date===_today&&!a.night&&a.period==="pm"&&_inClass(a.studentId);});
    var _t1Att=DB.attendance.filter(function(a){return a.date===_today&&!a.night&&a.period==="t1"&&_inClass(a.studentId);});
    var _t2Att=DB.attendance.filter(function(a){return a.date===_today&&!a.night&&a.period==="t2"&&_inClass(a.studentId);});
    var _allAtt=DB.attendance.filter(function(a){return a.date===_today&&!a.night&&(a.period||"all")==="all"&&_inClass(a.studentId);});
    // 按时段统计请假学生（请假管理联动）
    function _leaveAffects(lp,ap){if(!lp||lp==="all")return true;if(lp===ap)return true;if(ap==="am"&&lp==="breakfast")return true;if(ap==="pm"&&lp==="lunch")return true;return false;}
    function _leaveIdsFor(ap){var ids={};DB.leaves.filter(function(l){return l.status==="已批准"&&l.startDate<=_today&&l.endDate>=_today&&_leaveAffects(l.leavePeriod,ap);}).forEach(function(l){ids[l.studentId]=1;});return ids;}
    var _leaveAm=_leaveIdsFor("am"),_leavePm=_leaveIdsFor("pm"),_leaveT1=_leaveIdsFor("t1"),_leaveT2=_leaveIdsFor("t2");
    var _leaveCnt=dashList.filter(function(x){return _leaveAm[x.id]||_leavePm[x.id]||_leaveT1[x.id]||_leaveT2[x.id];}).length;
    // 计算各时段出勤率（v2.0.3 语义：无记录的学生默认出勤，与考勤页展示一致）
    function _calcRate(recs,leaveIds){
      if(!dashList.length)return 0;
      var present=0;
      dashList.forEach(function(x){
        var rec=recs.filter(function(a){return a.studentId===x.id;})[0];
        if(rec){if(rec.status==="present"&&!leaveIds[x.id])present++;}
        else{if(!leaveIds[x.id])present++;}
      });
      return present/dashList.length;
    }
    var _amRate=_calcRate(_amAtt,_leaveAm);
    var _pmRate=_calcRate(_pmAtt,_leavePm);
    var _t1Rate=_calcRate(_t1Att,_leaveT1);
    var _t2Rate=_calcRate(_t2Att,_leaveT2);
    var _amP=Math.round(_amRate*dashList.length),_pmP=Math.round(_pmRate*dashList.length);
    // v2.0.3 修复：全天出勤率计算——
    // 1) 若当天存在任一「分时段」考勤记录（上午/下午/一托/二托），全天出勤率以分时段聚合为准：
    //    某学生只要在任意有记录的时段不是出勤（迟到/请假/缺勤），该生当天就不计入全天出勤。
    //    避免旧的全天记录（自动生成的默认出勤）掩盖分时段里真实的请假/缺勤，导致全天显示100%。
    // 2) 仅当天只有「全天」记录时，直接用全天记录计算。
    // 3) 兜底：半天汇总法。
    var _hasPeriod=_amAtt.length||_pmAtt.length||_t1Att.length||_t2Att.length;
    // 全天聚合：当天任何时段的已批准请假（上午/下午/一托/二托）都算该生未全勤；大课间(recess)不计入出勤率
    var _leaveAny={};
    DB.leaves.filter(function(l){return l.status==="已批准"&&(l.leavePeriod||"all")!=="recess"&&l.startDate<=_today&&l.endDate>=_today&&dashList.some(function(x){return x.id===l.studentId;});}).forEach(function(l){_leaveAny[l.studentId]=1;});
    var dashAtt;
    if(_hasPeriod){
      var _dayAbsentSet={};
      dashList.forEach(function(x){
        var bad=false;
        [_amAtt,_pmAtt,_t1Att,_t2Att].forEach(function(rs){rs.forEach(function(a){if(a.studentId===x.id&&a.status!=="present")bad=true;});});
        if(bad||_leaveAny[x.id])_dayAbsentSet[x.id]=1;
      });
      dashAtt=dashList.length?(dashList.length-Object.keys(_dayAbsentSet).length)/dashList.length:0;
    }else if(_allAtt.length){
      dashAtt=_calcRate(_allAtt,_leaveAny);
    }else{
      dashAtt=dashList.length?(_amP+_pmP)/(dashList.length*2):0;
    }
    var _hasLeaveToday=Object.keys(_leaveAny).length>0;
    var _amPmTxt=(_hasPeriod||_hasLeaveToday)
      ?("全天"+fmtPct(dashAtt)+" · 上午"+fmtPct(_amRate)+" · 下午"+fmtPct(_pmRate)+" · 一托"+fmtPct(_t1Rate)+" · 二托"+fmtPct(_t2Rate))
      :(_allAtt.length?("全天"+fmtPct(dashAtt)+((_amAtt.length||_pmAtt.length)?" · 上午"+fmtPct(_amRate)+" · 下午"+fmtPct(_pmRate):""))
      :("上午"+fmtPct(_amRate)+" · 下午"+fmtPct(_pmRate)+" · 一托"+fmtPct(_t1Rate)+" · 二托"+fmtPct(_t2Rate)));
    var dashDisc=DB.discipline.filter(function(d){return dashList.some(function(x){return x.id===d.studentId;});}).length;
    var hwSub=0,hwMiss=0;
    DB.homework.forEach(function(h){dashList.forEach(function(x){if(h.submitted.indexOf(x.id)>=0)hwSub++;else if(h.missing.indexOf(x.id)>=0)hwMiss++;});});
    var hwRate=Math.round(hwSub/((hwSub+hwMiss)||1)*100);
    // 当日考勤明细（v2.0.3 修复：按学生维度统计，不再把多时段记录叠加计数）
    // v2.0.3.2 彻底打通请假⇄考勤：
    //   1) 先合并当天已批准请假单（任何时段请假都算该生当天请假，刷新后依然生效）；
    //   2) 再合并考勤记录，异常状态优先（缺勤>请假>迟到>出勤）——

  function dashModName(id){for(var i=0;i<DASH_MODULES.length;i++)if(DASH_MODULES[i].id===id)return DASH_MODULES[i].name;return id;}
  // 布局数据：默认顺序+宽度（12 列网格，col 取 4/6/8/10/12）
  function defaultDashLayout(){return [
    {id:"dash_stats",col:12},
    {id:"dash_alert",col:8},
    {id:"dash_quick",col:4},
    {id:"dash_remind",col:8},
    {id:"dash_todo",col:6},
    {id:"dash_tt",col:6},
    {id:"dash_rank",col:6},
    {id:"dash_count",col:6},
    {id:"dash_notice",col:12}
  ];}
  function getDashLayout(){
    var L=DB.setting.dashLayout;
    if(!L||!L.length){DB.setting.dashLayout=defaultDashLayout();return DB.setting.dashLayout;}
    var ids={};L.forEach(function(x){ids[x.id]=1;});
    defaultDashLayout().forEach(function(d){if(!ids[d.id])L.push(d);});
    return L;
  }
  function dashEdit(on){mstate.dashEdit=!!on;render();if(on)toast("布局编辑：拖动「⠿」排序，拖动模块右缘手柄调宽，点「完成」保存");}
  function dashResetLayout(){delete DB.setting.dashLayout;save();render();toast("已恢复默认布局");}
  // 拖拽排序（编辑态，v1.3.7 支持视口边缘自动滚动：指针贴近顶部/底部时页面跟随滚动，可跨屏放置）
  var _drag={on:false,fromId:"",overId:"",lastX:0,lastY:0,raf:0,scrollOn:false,scrollDir:0,scrollSpeed:0};
  function dashDragStart(e,id){
    if(!mstate.dashEdit)return;
    if(e.cancelable)e.preventDefault();
    _drag={on:true,fromId:id,overId:id,lastX:e.clientX,lastY:e.clientY,raf:0,scrollOn:false,scrollDir:0,scrollSpeed:0};
    document.body.style.cursor="grabbing";
    var el=document.querySelector('.dash-grid>.section[data-mod="'+id+'"]');
    if(el)el.classList.add("dragging");
    window.addEventListener("pointermove",dashDragMove);
    window.addEventListener("pointerup",dashDragEnd);
  }
  function dashDragMove(e){
    if(!_drag.on)return;
    if(e.cancelable)e.preventDefault();
    _drag.lastX=e.clientX;_drag.lastY=e.clientY;
    dashDragPick(e.clientX,e.clientY);
    dashAutoScroll(e.clientY);
  }
  // 计算指针下的目标模块并实时换位（滚动帧与 pointermove 共用）
  function dashDragPick(x,y){
    if(!_drag.on)return;
    var el=document.elementFromPoint(x,y);
    while(el&&!(el.classList&&el.classList.contains("section")&&el.dataset&&el.dataset.mod))el=el.parentElement;
    if(!el||el.dataset.mod===_drag.fromId){var oe=document.querySelector('.dash-grid>.section.drag-over');if(oe)oe.classList.remove("drag-over");return;}
    if(el.dataset.mod!==_drag.overId){
      var old=document.querySelector('.dash-grid>.section.drag-over');
      if(old)old.classList.remove("drag-over");
      _drag.overId=el.dataset.mod;
      el.classList.add("drag-over");
      swapDashOrder(_drag.fromId,_drag.overId);
    }
  }
  // 视口边缘自动滚动：距顶部/底部 80px 内按距离加速滚动（6~22px/帧），滚动后重算目标实现跨屏拖放
  function dashAutoScroll(y){
    if(!_drag.on)return;
    var zone=80;
    var vh=window.innerHeight;
    var dir=0,speed=0;
    if(y<zone){dir=-1;speed=Math.max(6,Math.ceil((zone-y)/zone*22));}
    else if(y>vh-zone){dir=1;speed=Math.max(6,Math.ceil((y-(vh-zone))/zone*22));}
    if(dir){
      _drag.scrollDir=dir;_drag.scrollSpeed=speed;
      if(!_drag.scrollOn){
        _drag.scrollOn=true;
        (function step(){
          if(!_drag.on||!_drag.scrollOn){_drag.scrollOn=false;_drag.raf=0;return;}
          var sc=document.scrollingElement||document.documentElement;
          sc.scrollTop+=_drag.scrollDir*_drag.scrollSpeed;
          dashDragPick(_drag.lastX,_drag.lastY);
          _drag.raf=window.requestAnimationFrame(step);
        })();
      }
    }else{
      _drag.scrollOn=false;
      if(_drag.raf){window.cancelAnimationFrame(_drag.raf);_drag.raf=0;}
    }
  }
  function swapDashOrder(a,b){
    var L=getDashLayout();
    var ia=-1,ib=-1;
    L.forEach(function(x,i){if(x.id===a)ia=i;if(x.id===b)ib=i;});
    if(ia<0||ib<0)return;
    var t=L[ia];L[ia]=L[ib];L[ib]=t;
    var elA=document.querySelector('.dash-grid>.section[data-mod="'+a+'"]');
    var elB=document.querySelector('.dash-grid>.section[data-mod="'+b+'"]');
    if(elA&&elB){elA.style.order=ib;elB.style.order=ia;}
  }
  function dashDragEnd(){
    if(!_drag.on)return;
    _drag.on=false;_drag.scrollOn=false;
    if(_drag.raf){window.cancelAnimationFrame(_drag.raf);_drag.raf=0;}
    document.body.style.cursor="";
    document.querySelectorAll(".dash-grid .section.dragging,.dash-grid .section.drag-over").forEach(function(x){x.classList.remove("dragging","drag-over");});
    save();render();
    window.removeEventListener("pointermove",dashDragMove);
    window.removeEventListener("pointerup",dashDragEnd);
  }
  // 拖拽调宽（编辑态）：拖动模块右缘手柄，12 列网格按偶数档 4~12 切宽
  function dashResizeStart(e,id){
    if(!mstate.dashEdit)return;
    e.preventDefault();e.stopPropagation();
    var el=document.querySelector('.dash-grid>.section[data-mod="'+id+'"]');
    if(!el)return;
    var item=null;getDashLayout().forEach(function(x){if(x.id===id)item=x;});
    if(!item)return;
    var grid=document.getElementById("dashGrid");
    if(!grid)return;
    var startX=e.clientX;
    var cellW=grid.offsetWidth/12;
    // 以「拖拽开始时的实际宽度」为固定换算基准：
    // 目标档位 = 初始宽度 + 鼠标位移，去程/回程完全对称，中间档（1/2 宽等）可稳定往返。
    // 旧逻辑用 item.col 实时参与换算，档位一跳基准就漂移，导致 1/2 宽回不去（死区）。
    var startW=el.getBoundingClientRect().width||(item.col*cellW);
    el.classList.add("resizing");
    document.body.style.cursor="ew-resize";
    function move(ev){
      var dx=ev.clientX-startX;
      if(!cellW)return;
      var ns=Math.round((startW+dx)/cellW);
      ns=Math.max(4,Math.min(12,ns));
      if(ns%2)ns+=dx>=0?1:-1;
      ns=Math.max(4,Math.min(12,ns));
      if(ns!==item.col){
        item.col=ns;
        el.className=el.className.replace(/col-\d+/,"col-"+ns);
      }
    }
    function up(){
      el.classList.remove("resizing");
      document.body.style.cursor="";
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
      save();render();
    }
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  }

  /* ============ 渲染：学生管理 ============ */

    if(search){var q=search.toLowerCase();list=list.filter(function(s){return s.name.toLowerCase().indexOf(q)>=0||String(s.no||"").toLowerCase().indexOf(q)>=0;});}
    if(mstate.groupFilter){var gf=parseInt(mstate.groupFilter,10);list=list.filter(function(s){return (s.groupNo||0)===gf;});}

  function saveClass(id){

    else{data.id="c"+Date.now();data.head=DB.setting.teacherName;data.count=0;DB.classes.push(data);}

  function deleteClass(id){
    var c=DB.classes.find(function(x){return x.id===id;});if(!c)return;
    var n=DB.students.filter(function(s){return s.id.indexOf(id+"-")===0;}).length;
    confirm2("确定删除班级「"+c.name+"」吗？将同时删除该班 "+n+" 名学生及相关成绩/考勤/记录，不可恢复。",function(){
    DB.classes=DB.classes.filter(function(x){return x.id!==id;});
    DB.students=DB.students.filter(function(s){return s.id.indexOf(id+"-")!==0;});
    ["attendance","leaves","points","discipline","communications","talks","evaluations","honors"].forEach(function(k){DB[k]=DB[k].filter(function(r){return !(r.studentId&&String(r.studentId).indexOf(id+"-")===0);});});
    DB.seatSetting.layout.forEach(function(row){row.forEach(function(x,ci){if(x&&String(x).indexOf(id+"-")===0)row[ci]=null;});});
    if(DB.subjectSelection)Object.keys(DB.subjectSelection).forEach(function(k){if(String(k).indexOf(id+"-")===0)delete DB.subjectSelection[k];});
    if(DB.quality)Object.keys(DB.quality).forEach(function(k){if(String(k).indexOf(id+"-")===0)delete DB.quality[k];});
    save();closeModal();render();toast("已删除班级 "+c.name);
    if(filterClass===id)filterClass=DB.classes[0]?DB.classes[0].id:"all";
    if(DB.setting.dashClass===id)DB.setting.dashClass=DB.classes[0]?DB.classes[0].id:"all";
    if(current==="classes")mstate={};
    save();render();toast("已删除班级 "+c.name);
    });
  }

  function renderKnowledgeStats(){
    DB.knowledgeStats=DB.knowledgeStats||[];
    var examOpts=classExams().slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}).map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>';}).join("");

    var list=DB.knowledgeStats.filter(function(k){return !fExam||k.examId===fExam;});
    var totalScore=0,totalFull=0;
    list.forEach(function(k){totalScore+=k.avgScore||0;totalFull+=k.fullScore||0;});
    var lossRate=totalFull?Math.round((1-totalScore/totalFull)*1000)/10:0;
    var rows=list.slice().sort(function(a,b){return (b.lossRate||0)-(a.lossRate||0);}).map(function(k){
      var lr=k.lossRate!=null?k.lossRate:Math.round((1-(k.avgScore||0)/(k.fullScore||1))*1000)/10;
      var w=Math.max(4,Math.round(lr*2.2));
      return '<div class="rec-row"><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><b>'+esc(k.knowledge)+'</b><span class="'+(lr>=50?"tag red":(lr>=30?"tag amber":"tag green"))+'">失分率 '+lr+'%</span></div>'
        +'<div style="height:8px;background:var(--border);border-radius:4px;margin-top:6px;overflow:hidden"><div style="height:100%;width:'+w+'%;background:'+(lr>=50?"var(--red)":(lr>=30?"var(--amber)":"var(--green)"))+'"></div></div>'
        +'<div class="muted" style="font-size:12px;margin-top:4px">'+esc(k.subject)+' · 班均 '+(k.avgScore!=null?k.avgScore:"—")+' / '+(k.fullScore||"—")+' 分</div></div>'
        +'<button class="icon-btn del" onclick="App.deleteKnowledgeStat(\''+k.id+'\')">'+ICONS.trash+'</button></div>';
    }).join("")||'<div class="empty">暂无知识点记录，点击「录入知识点成绩」添加</div>';
    var summary='<div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px">'
      +'<div class="card"><div class="stat"><span class="dot" style="background:var(--red)"></span><div class="meta"><div class="k">当前平均失分率</div><div class="v">'+lossRate+'%</div></div></div></div>'
      +'<div class="card"><div class="stat"><span class="dot" style="background:var(--blue)"></span><div class="meta"><div class="k">已录知识点</div><div class="v">'+list.length+' 个</div></div></div></div>'
      +'<div class="card"><div class="stat"><span class="dot" style="background:var(--red)"></span><div class="meta"><div class="k">高失分（≥50%）</div><div class="v">'+list.filter(function(k){return (k.lossRate!=null?k.lossRate:Math.round((1-(k.avgScore||0)/(k.fullScore||1))*1000)/10)>=50;}).length+' 个</div></div></div></div></div>';
    return '<div class="toolbar"><button class="btn btn-primary btn-sm" onclick="App.addKnowledgeStat()">'+ICONS.plus+' 录入知识点成绩</button>'
      +'<span class="count-pill">考试 <select class="select" style="max-width:150px" onchange="App.setKnExam(this.value)"><option value="">全部</option>'+examOpts+'</select></span></div>'

  }

  function renderGradesAnalysis(){
    var _ce=classExams();var eid=mtab==="分析"&&mstate.examId?mstate.examId:(_ce[_ce.length-1]&&_ce[_ce.length-1].id);
    if(!eid)return '<div class="empty">暂无考试数据</div>';
    var exam=DB.exams.find(function(e){return e.id===eid;});
    var sc=classScores(eid);
    var sel='<select class="select" onchange="App.pickExam(this.value)">'+classExams().map(function(e){return '<option value="'+e.id+'"'+(e.id===eid?" selected":"")+'>'+esc(e.name)+'</option>';}).join("")+'</select>';
    var totals=sc.map(function(r){return r.total;}).filter(function(v){return v>0;});
    var avg=Math.round(totals.reduce(function(a,b){return a+b;},0)/(totals.length||1));
    var max=Math.max.apply(null,totals.concat([0])),min=Math.min.apply(null,totals.concat([0]));
    var pass=Math.round(totals.filter(function(v){return v>=exam.total*0.6;}).length/(totals.length||1)*100);
    var buckets=[["优秀 ≥"+Math.round(exam.total*0.85),0,"var(--green)"],["良好",0,"var(--blue)"],["中等",0,"var(--amber)"],["待提高 <"+Math.round(exam.total*0.6),0,"var(--red)"]];
    totals.forEach(function(v){if(v>=exam.total*0.85)buckets[0][1]++;else if(v>=exam.total*0.7)buckets[1][1]++;else if(v>=exam.total*0.6)buckets[2][1]++;else buckets[3][1]++;});
    var dist=hBars(buckets.map(function(b){return {label:b[0],value:b[1],color:b[2]};}));
    // 各科均分
    var subjAvg=exam.subjects.map(function(sub){var arr=sc.map(function(r){var f=r.subjects.find(function(x){return x.name===sub.name;});return f?f.score:0;});return {label:sub.name,value:Math.round(arr.reduce(function(a,b){return a+b;},0)/(arr.length||1)),color:DB.setting.subjectColors[sub.name]||"var(--blue)"};});
    var subjBars=hBars(subjAvg,100);
    // 排名表（含与上次考试对比）
    var _allExams=classExams();var prevExam=_allExams[_allExams.indexOf(exam)-1];
    var prevRanks={};
    if(prevExam){DB.scores.filter(function(x){return x.examId===prevExam.id;}).forEach(function(r){prevRanks[r.studentId]=r.rank;});}
    var rankRows=sc.sort(function(a,b){return a.rank-b.rank;}).slice(0,15).map(function(r){
      var st=studentById(r.studentId);
      var arrow="";
      if(prevRanks[r.studentId]){var diff=prevRanks[r.studentId]-r.rank;if(diff>0)arrow='<span style="color:var(--red)">▲'+diff+'</span>';else if(diff<0)arrow='<span style="color:var(--green)">▼'+(-diff)+'</span>';else arrow='<span class="muted">—</span>';}
      return '<tr><td>'+r.rank+'</td><td>'+(st?esc(st.name):"")+'</td><td>'+r.total+'</td><td>'+arrow+'</td></tr>';
    }).join("");
    return '<div class="toolbar">'+sel+'</div>'
      +'<div class="grid-2">'
        +'<div class="card"><div class="card-head"><h3>核心指标</h3></div>'
          +'<div class="stat" style="margin-bottom:12px"><span class="dot" style="background:var(--blue)"></span><div class="meta"><div class="k">平均分</div><div class="v">'+avg+'</div><div class="s">最高 '+max+' · 最低 '+min+'</div></div></div>'
          +'<div class="kv"><span class="k">及格率（≥60%）</span><b>'+pass+'%</b></div>'
          +'<div class="kv"><span class="k">参考人数</span><b>'+sc.length+'</b></div>'
        +'</div>'
        +'<div class="card"><div class="card-head"><h3>分数段分布</h3></div>'+dist+'</div>'
      +'</div>'
      +'<div class="grid-2" style="margin-top:16px">'
        +'<div class="card"><div class="card-head"><h3>各科均分对比</h3></div>'+subjBars+'</div>'

  /* ============ 渲染：考勤 ============ */
  function renderAttendance(){
    if(mtab==="查寝") return renderNightCheck();
    if(mtab==="离校") return renderWeekend();
    var date=mstate.attDate||todayStr();
    var period=mstate.attPeriod||"all";
    var tabs='<div class="mtab"><button class="'+(mtab!=="查寝"&&mtab!=="离校"?"on":"")+'" onclick="App.setMtab(\'\')">日常点名</button><button class="'+(mtab==="查寝"?"on":"")+'" onclick="App.setMtab(\'查寝\')">寄宿查寝</button><button class="'+(mtab==="离校"?"on":"")+'" onclick="App.setMtab(\'离校\')">离校闭环</button></div>';
    var periodTabs='<div class="mtab" style="margin-bottom:12px"><button class="'+(period==="all"?"on":"")+'" onclick="App.setAttPeriod(\'all\')">全天</button><button class="'+(period==="am"?"on":"")+'" onclick="App.setAttPeriod(\'am\')">上午</button><button class="'+(period==="pm"?"on":"")+'" onclick="App.setAttPeriod(\'pm\')">下午</button><button class="'+(period==="recess"?"on":"")+'" onclick="App.setAttPeriod(\'recess\')">大课间</button><button class="'+(period==="t1"?"on":"")+'" onclick="App.setAttPeriod(\'t1\')">一托</button><button class="'+(period==="t2"?"on":"")+'" onclick="App.setAttPeriod(\'t2\')">二托</button><div class="muted" style="font-size:11px;padding:2px 2px 0">大课间考勤独立记录，不计入出勤率</div></div>';
    var list=DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;});
    // 获取当天已批准的请假学生（请假管理联动，按时段匹配）
    var _leaveIds={};
    function _leaveAffects(lp,ap){if(!lp||lp==="all")return true;if(lp===ap)return true;if(ap==="am"&&lp==="breakfast")return true;if(ap==="pm"&&lp==="lunch")return true;return false;}
    // v2.0.3.2 打通：全天页签聚合当天所有时段请假（上午/下午/一托/二托，大课间不计入出勤、仅在大课间页签显示）；分时段页签只匹配对应时段
    DB.leaves.filter(function(l){return l.status==="已批准"&&l.startDate<=date&&l.endDate>=date;}).forEach(function(l){if(period==="all"){if((l.leavePeriod||"all")!=="recess")_leaveIds[l.studentId]=1;}else if(_leaveAffects(l.leavePeriod,period))_leaveIds[l.studentId]=1;});
    var recs=DB.attendance.filter(function(a){return a.date===date&&(a.period||"all")===period&&!a.night;});
    var map={};recs.forEach(function(a){map[a.studentId]=a;});
    // v2.0.3 修复：渲染时不再自动写库（原逻辑打开页面即全员生成记录，5时段×48人=240条爆炸）。
    // 现在无记录时仅内存构建"默认全出勤"视图，用户点击修改或点「保存点名」时才真正保存。
    if(!recs.length){
      list.forEach(function(s){map[s.id]={id:uid(),date:date,studentId:s.id,status:_leaveIds[s.id]?"leave":"present",night:false,period:period};});
    }else{
      // 已有记录时，同步请假管理的批准状态（请假学生自动设为leave）——仅改内存，不写库
      list.forEach(function(s){
        if(_leaveIds[s.id]&&map[s.id]&&map[s.id].status!=="leave"){
          map[s.id].status="leave";
        }
      });
    }
    // 智能排序：请假 > 迟到/缺勤 > 出勤
    var _statusOrder={leave:0,absent:1,late:2,present:3};
    list=list.slice().sort(function(a,b){
      var sa=map[a.id]?map[a.id].status:"present";
      var sb=map[b.id]?map[b.id].status:"present";
      return (_statusOrder[sa]||3)-(_statusOrder[sb]||3);
    });
    var statuses=[["present","出勤","var(--green)"],["late","迟到","var(--amber)"],["leave","请假","var(--purple)"],["absent","缺勤","var(--red)"]];
    var rows=list.map(function(s){
      var rec=map[s.id]||{status:"present"};
      var cur=rec.status||"present";
      var btns=statuses.map(function(st){return '<button class="seg-btn'+(cur===st[0]?' on':'')+'" style="'+(cur===st[0]?'background:'+st[2]+';border-color:'+st[2]+';color:#fff':'')+'" onclick="App.setAtt(\''+s.id+'\',\''+date+'\',\''+st[0]+'\',\''+period+'\')">'+st[1]+'</button>';}).join("");
      var mealCols="";
      if(period==="am"){
        var bf=rec.breakfast?"checked":"";
        mealCols='<td style="width:90px;text-align:center"><label style="cursor:pointer;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" '+bf+' onchange="App.setMeal(\''+s.id+'\',\''+date+'\',\'breakfast\',this.checked,\''+period+'\')"> 早餐</label></td>';
      }else if(period==="pm"){
        var lc=rec.lunch?"checked":"";
        var bd=rec.boarding?"checked":"";
        mealCols='<td style="width:90px;text-align:center"><label style="cursor:pointer;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" '+lc+' onchange="App.setMeal(\''+s.id+'\',\''+date+'\',\'lunch\',this.checked,\''+period+'\')"> 午餐</label></td><td style="width:90px;text-align:center"><label style="cursor:pointer;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" '+bd+' onchange="App.setMeal(\''+s.id+'\',\''+date+'\',\'boarding\',this.checked,\''+period+'\')"> 托管</label></td>';
      }
      return '<tr><td><div class="stu"><div class="ava" style="background:'+avatarColor(s.name)+';width:28px;height:28px;flex:0 0 28px;font-size:12px">'+s.name.charAt(0)+'</div>'+esc(s.name)+'</div></td><td style="width:260px"><div class="seg">'+btns+'</div></td>'+mealCols+'</tr>';
    }).join("");
    var counts={present:0,late:0,leave:0,absent:0};
    list.forEach(function(s){var rec=map[s.id]||{status:"present"};counts[rec.status||"present"]++;});
    var mealStats="";
    if(period==="am"){
      var bfCnt=recs.filter(function(a){return a.breakfast;}).length;
      mealStats='<div class="data-card" style="padding:8px"><div class="data-num" style="font-size:24px;color:var(--orange)">'+bfCnt+'</div><div class="data-sub">早餐</div></div>';
    }else if(period==="pm"){
      var lcCnt=recs.filter(function(a){return a.lunch;}).length;
      var bdCnt=recs.filter(function(a){return a.boarding;}).length;
      mealStats='<div class="data-card" style="padding:8px"><div class="data-num" style="font-size:24px;color:var(--orange)">'+lcCnt+'</div><div class="data-sub">午餐</div></div><div class="data-card" style="padding:8px"><div class="data-num" style="font-size:24px;color:var(--teal)">'+bdCnt+'</div><div class="data-sub">托管</div></div>';
    }
    var thead='<tr><th>学生</th><th>状态（点击切换）</th>';
    if(period==="am") thead+='<th style="width:90px">早餐</th>';
    if(period==="pm") thead+='<th style="width:90px">午餐</th><th style="width:90px">托管</th>';
    thead+='</tr>';
    return tabs
      +periodTabs
      +'<div class="toolbar"><span class="count-pill">当前班级：'+esc(clsName(filterClass))+'</span><span class="count-pill">日期</span><input type="date" class="select" value="'+date+'" onchange="App.setAttDate(this.value)">'
        +'<button class="btn btn-soft btn-sm" onclick="App.allPresent(\''+date+'\',\''+period+'\')">'+ICONS.check+' 全部出勤</button>'
        +'<button class="btn btn-primary btn-sm" onclick="App.saveAtt(\''+date+'\',\''+period+'\')">'+ICONS.check+' 保存点名</button>'
        +'<button class="btn btn-outline btn-sm" onclick="App.exportAttendanceCSV(\'week\')">'+ICONS.download+' 导出本周</button>'
        +'<button class="btn btn-outline btn-sm" onclick="App.exportAttendanceCSV(\'month\')">'+ICONS.download+' 导出本月</button>'
      +'</div>'
      +'<div class="card" style="padding:14px;margin-bottom:14px"><div class="grid-4" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr))"><div class="data-card" style="padding:8px"><div class="data-num" style="font-size:24px;color:var(--green)">'+counts.present+'</div><div class="data-sub">出勤</div></div><div class="data-card" style="padding:8px"><div class="data-num" style="font-size:24px;color:var(--amber)">'+counts.late+'</div><div class="data-sub">迟到</div></div><div class="data-card" style="padding:8px"><div class="data-num" style="font-size:24px;color:var(--purple)">'+counts.leave+'</div><div class="data-sub">请假</div></div><div class="data-card" style="padding:8px"><div class="data-num" style="font-size:24px;color:var(--red)">'+counts.absent+'</div><div class="data-sub">缺勤</div></div>'+mealStats+'</div></div>'
      +'<div class="card pad0"><table><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div>';
  }

      var rows=list.map(function(s){

        var sel='<select onchange="App.markHW(\''+h.id+'\',\''+s.id+'\',this.value)" style="padding:4px 8px;border-radius:8px;border:1px solid var(--border-strong)"><option value="miss"'+(st==="miss"?" selected":"")+'>未交</option><option value="sub"'+(st==="sub"?" selected":"")+'>已交</option><option value="late"'+(st==="late"?" selected":"")+'>迟交</option></select>';
        return '<tr><td><div class="stu"><div class="ava" style="background:'+avatarColor(s.name)+';width:28px;height:28px;flex:0 0 28px;font-size:12px">'+s.name.charAt(0)+'</div>'+esc(s.name)+'</div></td><td style="width:140px">'+sel+'</td></tr>';
      }).join("");
      var rate=Math.round(h.submitted.length/(h.submitted.length+h.missing.length||1)*100);

        +'<div class="card pad0"><table><thead><tr><th>学生</th><th>收缴状态</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
    var cards=DB.homework.map(function(h){
      var rate=Math.round(h.submitted.length/(h.submitted.length+h.missing.length||1)*100);
      var c=rate<80?"var(--amber)":"var(--green)";
      return '<div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div style="font-weight:700">'+esc(h.subject)+' · '+esc(h.requirement)+'</div><div class="muted" style="font-size:12px">布置 '+h.date+' · 截止 '+esc(h.deadline)+'</div></div>'
        +'<div style="width:120px"><div class="bar"><i style="width:'+rate+'%;background:'+c+'"></i></div><div class="muted" style="font-size:12px;text-align:right;margin-top:2px">'+rate+'%</div></div></div>'
        +'<div class="row-actions" style="margin-top:10px"><button class="btn btn-soft btn-sm" onclick="App.collectHW(\''+h.id+'\')">收缴登记</button><button class="icon-btn" onclick="App.editHW(\''+h.id+'\')">'+ICONS.edit+'</button><button class="icon-btn del" onclick="App.deleteHW(\''+h.id+'\')">'+ICONS.trash+'</button></div></div>';
    }).join("");
    if(!cards)cards='<div class="empty">暂无作业，请布置</div>';
    var total=DB.homework.reduce(function(a,h){return a+h.submitted.length+h.missing.length;},0);
    var avg=total?Math.round(DB.homework.reduce(function(a,h){return a+h.submitted.length;},0)/total*100):0;
    var th='<div class="mtab"><button class="'+(mtab!=="工具"&&mtab!=="题库"?"on":"")+'" onclick="App.setMtabHW()">收缴管理</button><button class="'+(mtab==="工具"?"on":"")+'" onclick="App.setMtab(\'工具\')">提效工具</button><button class="'+(mtab==="题库"?"on":"")+'" onclick="App.setMtab(\'题库\')">分层题库</button></div>';
    if(mtab==="工具")return th+renderHwTools();
    if(mtab==="题库")return th+renderQuestionBank();
    return th+'<div class="toolbar"><button class="btn btn-primary" onclick="App.addHW()">'+ICONS.plus+' 布置作业</button><span class="count-pill">累计 '+DB.homework.length+' 次 · 平均收缴率 '+avg+'%</span></div><div class="grid-2">'+cards+'</div>';
  }

    var lvSel='<select class="select" style="max-width:110px" onchange="App.setQbFilter(\''+fSub+'\',this.value)"><option>全部</option>'+["基础","提升","中考专项"].map(function(l){return '<option'+(fLv===l?" selected":"")+'>'+l+'</option>';}).join("")+'</select>';

        +(q.answer?'<div style="margin-top:3px;font-size:12px;color:var(--teal)">✅ '+esc(q.answer)+'</div>':"")

  function assignFromBank(id){
    var q=(DB.questionBank||[]).filter(function(x){return x.id===id;})[0];if(!q)return;
    var clsStu=DB.students.filter(function(s){return s.id.indexOf(filterClass+"-")===0;});
    var hw={id:uid(),subject:q.subject,requirement:"【"+q.level+"】"+q.chapter+"："+q.question.slice(0,24)+(q.question.length>24?"…":""),deadline:"本周",submitted:clsStu.map(function(s){return s.id;}),late:[],missing:[]};
    DB.homework.push(hw);
    save();closeModal();render();toast("已布置分层作业："+q.level+" · "+q.chapter);
