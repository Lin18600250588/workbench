  function confirmResUpload(){
    var meta={subject:document.getElementById("rm_sub").value,lessonType:document.getElementById("rm_lesson").value,chapter:document.getElementById("rm_chapter").value.trim()||"—",tag:document.getElementById("rm_tag").value.trim()||"—"};
    var files=_resPendingFiles.slice();_resPendingFiles=[];
    closeModal();
    var pending=files.length,done=0;
    function finish(){done++;if(done>=pending){var ok=save();render();toast(ok?"已上传 "+files.length+" 个资源并归类":"存储空间不足，部分文件内容未能保存");}}
    for(var i=0;i<files.length;i++){
      (function(f){
        var rd=new FileReader();
        rd.onload=function(){
          var isImg=/^image\//.test(f.type)||/\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name);
          var tooBig=!isImg&&f.size>2*1024*1024;
          var m={id:uid(),name:f.name,type:detectType(f.name),subject:meta.subject,lessonType:meta.lessonType,chapter:meta.chapter,tag:meta.tag,size:(f.size/1024<1024?Math.round(f.size/1024)+"KB":(f.size/1024/1024).toFixed(1)+"MB"),date:todayStr(),data:isImg||tooBig?"":rd.result,tooBig:tooBig};
          if(isImg){
            var img=new Image();
            img.onload=function(){
              var w=img.width,h=img.height,max=1200;
              if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
              var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
              m.data=cv.toDataURL("image/jpeg",0.8);
              DB.resources.push(m);finish();
            };
            img.onerror=function(){DB.resources.push(m);finish();};
            img.src=rd.result;
          }else{DB.resources.push(m);finish();}
        };
        rd.onerror=function(){finish();};
        rd.readAsDataURL(f);
      })(files[i]);
    }
  }

    var cur=((DB.subjectSelection||{})[sid]||"").trim();
    var curSet={};
    if(mode==="old"){if(cur.indexOf("文")===0)curSet["文科"]=1;else if(cur.indexOf("理")===0)curSet["理科"]=1;}
    else{
      var i;

  // v1.4.2：头像压缩——手机照片转 base64 常达数 MB，超过 localStorage 5MB 配额导致保存静默失败、刷新重置
  function compressAvatar(file,cb){
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var MAX=256;
          var w=img.width,h=img.height;
          if(w>MAX||h>MAX){var r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
          var cv=document.createElement("canvas");cv.width=w;cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          cb(cv.toDataURL("image/jpeg",0.85));
        }catch(e){cb(rd.result);}
      };
      img.onerror=function(){cb(rd.result);};
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

      var date=fval("f_fin_date")||todayStr();var note=fval("f_fin_note");
      f.records.push({id:uid(),type:type,category:category,amount:amount,date:date,note:note,operator:DB.setting.teacherName||"班主任"});
      f.balance+=(type==="收入"?amount:-amount);
      save();closeModal();render();toast("已记录收支");
    }else{
      var payAmt=fnum("f_fin_pay_amt");if(payAmt<=0){toast("请输入有效金额");return;}
      var payDate=fval("f_fin_pay_date")||todayStr();
      var checked=document.querySelectorAll(".fin_stu_check:checked");
      if(!checked.length){toast("请至少选择一名学生");return;}
      var cnt=0;var total=0;
      checked.forEach(function(cb){

        if(!f.payments[sid]){
          f.payments[sid]={amount:payAmt,date:payDate};
          cnt++;total+=payAmt;
        }
      });
      if(cnt>0){
        f.records.push({id:uid(),type:"收入",category:"学生班费",amount:total,date:payDate,note:cnt+"名学生缴纳班费（每人¥"+payAmt+"）",operator:DB.setting.teacherName||"班主任"});

      save();closeModal();render();

  // v2.0.3.6 突发事件现场图片（多张）：拍照/相册多选 → 自动压缩（最长边900px JPEG）→ base64 数组存储
  var _incImgs=[];
  function incRenderGrid(){
    var g=document.getElementById("f_inc_grid");
    if(!g)return;
    g.innerHTML=_incImgs.map(function(p,i){return '<div class="photo-thumb"><img src="'+p+'" onclick="App.incViewImg(\'preview\','+i+')"><span class="x" onclick="App.incRemoveImg('+i+')">✕</span></div>';}).join("");
    if(_incImgs.length>=9){var up=document.getElementById("f_inc_file");if(up)up.disabled=true;}
  }
  function incPickImgs(inp){
    var files=inp.files;if(!files||!files.length)return;
    for(var i=0;i<files.length&&_incImgs.length<9;i++){
      (function(f){
        var rd=new FileReader();
        rd.onload=function(){
          var img=new Image();
          img.onload=function(){
            var w=img.width,h=img.height,max=900;
            if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
            var cv=document.createElement("canvas");cv.width=w;cv.height=h;
            cv.getContext("2d").drawImage(img,0,0,w,h);
            if(_incImgs.length>=9){toast("最多 9 张照片");return;}
            _incImgs.push(cv.toDataURL("image/jpeg",0.7));
            incRenderGrid();
          };
          img.onerror=function(){toast("图片读取失败，请换一张重试");};
          img.src=rd.result;
        };
        rd.readAsDataURL(f);
      })(files[i]);
    }
    inp.value="";
  }

  function saveLibraryBook(){
    var title=fval("f_lib_title");if(!title){toast("请输入书名");return;}
    var author=fval("f_lib_author");var pub=fval("f_lib_pub");
    var cat=fval("f_lib_cat");var total=fint("f_lib_total")||1;
    var callno=fval("f_lib_callno");var desc=fval("f_lib_desc");
    DB.libraryBooks=DB.libraryBooks||[];

  function borrowBook(bookId){
    var b=DB.libraryBooks.find(function(x){return x.id===bookId;});if(!b)return;
    if(b.available<=0){toast("已无库存可借");return;}
    var body='<div class="field"><label>借书学生</label>'+studentSelectHTML("","f_lib_bw_")+'</div>'
      +'<div class="grid-2col"><div class="field"><label>借出日期</label><input id="f_lib_bwdate" type="date" value="'+todayStr()+'"></div>'
      +'<div class="field"><label>应还日期</label><input id="f_lib_duedate" type="date" value=""></div></div>'
      +'<div class="note">图书：《'+esc(b.title)+'》· 可借 '+b.available+' 册</div>';
    modal("办理借书",body,'<button class="btn btn-ghost" onclick="App.closeModal()">取消</button><button class="btn btn-primary" onclick="App.saveBorrow(\''+bookId+'\')">确认借出</button>');
  }
  function saveBorrow(bookId){
    var b=DB.libraryBooks.find(function(x){return x.id===bookId;});if(!b)return;
    var sid=fval("f_lib_bw_student");if(!sid){toast("请选择学生");return;}
    var st=studentById(sid);var bdate=fval("f_lib_bwdate")||todayStr();var due=fval("f_lib_duedate");
    b.borrowers=b.borrowers||[];b.borrowers.push({studentId:sid,date:bdate,due:due});
    b.available--;
    save();closeModal();render();toast((st?st.name:"")+" 已借出《"+b.title+"》");
  }
  function returnBook(bookId){
    var b=DB.libraryBooks.find(function(x){return x.id===bookId;});if(!b)return;
    if(!b.borrowers||!b.borrowers.length){toast("无借出记录");return;}
    var opts=b.borrowers.map(function(br,i){var st=studentById(br.studentId);return '<option value="'+i+'">'+(st?esc(st.name):"未知")+'（借于'+br.date+'）</option>';}).join("");
    var body='<div class="field"><label>选择归还记录</label><select id="f_lib_rt_idx" class="select" style="max-width:none">'+opts+'</select></div>'
      +'<div class="note">图书：《'+esc(b.title)+'》· 当前借出 '+b.borrowers.length+' 册</div>';
    modal("办理还书",body,'<button class="btn btn-ghost" onclick="App.closeModal()">取消</button><button class="btn btn-primary" onclick="App.saveReturn(\''+bookId+'\')">确认归还</button>');
  }
  function saveReturn(bookId){
    var b=DB.libraryBooks.find(function(x){return x.id===bookId;});if(!b)return;
    var idx=parseInt(fval("f_lib_rt_idx"),10);if(isNaN(idx)||idx<0||idx>=b.borrowers.length){toast("请选择归还记录");return;}
    var br=b.borrowers[idx];var st=studentById(br.studentId);
    b.borrowers.splice(idx,1);b.available++;
    save();closeModal();render();toast((st?st.name:"")+" 已归还《"+b.title+"》");
  }

    try{
      if(window.scrollY<10){
        var navEl=document.getElementById("nav");
        if(navEl)navEl.scrollTop=0;
      }
    }catch(e){}
  });
})();
</script>
</body>
</html>
